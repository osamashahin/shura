<style>
:root{
  --jouf:#6B3FA0; --jouf-deep:#4A2878; --jouf-soft:#F0EBF8; --jouf-line:#D4C5E8; --head:#FDFCFF;
  --ink:#2D1B5E; --muted:#7B6FA0; --line:#D4C5E8; --line-2:#EDE6F6; --paper:#F5F3FA; --surface:#FFFFFF; --field:#FAFAFA;
  --ok:#15803D; --ok-soft:#F0FDF4; --ok-line:#BBF7D0; --warn:#B45309; --warn-soft:#FFFBEB; --warn-line:#FDE68A;
  --late:#B91C1C; --late-soft:#FEF2F2; --late-line:#FECACA; --info:#1D5B94; --info-soft:#EFF6FF; --info-line:#BFDBFE;
  --radius:13px; --font:"Tajawal",Tahoma,Arial,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.65}
button,input,select,textarea,option,optgroup{font:inherit;font-family:var(--font);color:inherit}
h1,h2,h3,h4,h5,h6,table,th,td,small,label{font-family:var(--font)}
a{color:var(--jouf)}
:focus-visible{outline:2px solid var(--jouf);outline-offset:2px}
.demo-bar{background:var(--warn-soft);color:var(--warn);text-align:center;font-size:12.5px;padding:6px 12px;border-bottom:1px solid var(--warn-line)}
.version{position:fixed;bottom:8px;left:10px;z-index:40;font-size:10.5px;color:#5B4A7A;background:rgba(255,255,255,.7);padding:3px 10px;border-radius:9px;pointer-events:none;box-shadow:0 1px 4px rgba(74,40,120,.1)}

/* ---------- splash (same feel as the training portal) ---------- */
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#4A2878,#6B3FA0);display:grid;place-items:center;color:#fff;transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;padding:24px}
.sp-logo{position:relative;display:flex;align-items:center;justify-content:center;width:380px;height:380px;max-width:92vw;margin-bottom:10px}
.sp-img{width:min(220px,58vw);height:auto;position:relative;z-index:1;filter:drop-shadow(0 6px 24px rgba(0,0,0,.25));animation:spPop .8s cubic-bezier(.34,1.56,.64,1) both}
.sp-ring{position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.15);animation:spPulse 2.4s ease-in-out infinite}
.sp-ring.r1{width:270px;height:270px}.sp-ring.r2{width:320px;height:320px;animation-delay:.6s;border-width:1px}.sp-ring.r3{width:370px;height:370px;animation-delay:1.2s;border-width:.5px}
.sp-bar{width:160px;height:4px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;animation:spFade .6s ease .5s both}
.sp-bar i{display:block;height:100%;background:#fff;border-radius:99px;width:0;animation:spBar 2.4s cubic-bezier(.4,0,.2,1) .6s forwards}
.sp-sub{font-size:12px;opacity:.65;margin-top:12px;animation:spFade .6s ease .7s both}
@keyframes spPop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes spPulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.75;transform:scale(1.04)}}
@keyframes spFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- login ---------- */
.login-bg{min-height:100vh;background:linear-gradient(135deg,#F0EBF8,#E8DEFF,#F5F3FA);display:flex;align-items:center;justify-content:center;padding:20px}
.lw{display:flex;background:#fff;border-radius:20px;border:1px solid var(--line);overflow:hidden;width:100%;max-width:900px;min-height:540px;box-shadow:0 8px 40px rgba(107,63,160,.15)}
.ll{flex:1;background:linear-gradient(160deg,var(--jouf-deep),var(--jouf));padding:40px 34px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;color:#fff}
.ll::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;border:50px solid rgba(255,255,255,.06);top:-70px;left:-70px}
.ll::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;border:35px solid rgba(255,255,255,.06);bottom:-40px;right:-40px}
.ll .z{position:relative;z-index:1}
.ju-box{background:rgba(255,255,255,.95);border-radius:14px;padding:8px 16px;display:inline-flex;align-items:center;margin-bottom:22px}
.ju-box img{height:74px;width:auto;display:block}
.ll .wq{width:min(230px,100%);height:auto;display:block;margin-bottom:16px}
.ll p{font-size:13px;color:rgba(255,255,255,.75);margin:0;line-height:1.8}
.ll .foot{font-size:12.5px;color:rgba(255,255,255,.85)}
.ll .foot small{display:block;font-size:11px;color:rgba(255,255,255,.55);margin-top:4px}
.lr{flex:1;padding:44px 38px;display:flex;flex-direction:column;justify-content:center;min-width:280px}
.lr h2{font-size:20px;font-weight:700;color:var(--jouf-deep);margin:0 0 4px}
.lr .sub{font-size:13px;color:var(--muted);margin:0 0 20px}
.lr .note{margin-top:14px;padding:10px 13px;background:var(--jouf-soft);border-radius:8px;font-size:11.5px;color:var(--muted);text-align:center;border:1px solid var(--line);line-height:1.8}
@media (max-width:760px){.lw{flex-direction:column;min-height:0}.ll{padding:26px 24px;gap:18px}.lr{padding:28px 22px;min-width:0}}

/* ---------- form controls ---------- */
label.f{display:block;margin-bottom:13px}
label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.inp{width:100%;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:9px 13px;min-height:40px;color:var(--ink);transition:border .2s,background .2s}
textarea.inp{min-height:76px;resize:vertical;line-height:1.75}
.inp:focus{border-color:var(--jouf);outline:none;background:var(--jouf-soft)}
.inp:disabled{background:var(--jouf-soft);color:var(--muted)}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--jouf);border-radius:7px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px;min-height:36px;white-space:nowrap;transition:all .15s}
.btn:hover{background:var(--jouf-soft)}
.btn.primary{background:var(--jouf);border-color:var(--jouf);color:#fff}
.btn.primary:hover{background:var(--jouf-deep)}
.btn.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.btn.ok:hover{background:#DCFCE7}
.btn.danger{background:var(--late-soft);border-color:var(--late-line);color:var(--late)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12px}
.btn.block{width:100%;justify-content:center;padding:11px;font-size:14px;font-weight:700;border-radius:9px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.err{background:var(--late-soft);border:1px solid var(--late-line);color:var(--late);padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:12px}
.hint{font-size:12.5px;color:var(--muted)}

/* ---------- app shell ---------- */
.tb{background:#fff;border-bottom:2px solid var(--line);padding:0 22px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}
.br{display:flex;align-items:center;gap:10px;min-width:0}
.bi{height:50px;border-radius:9px;background:#fff;display:flex;align-items:center;flex:none}
.bi img{height:50px;width:auto;display:block}
.bt{font-size:17px;font-weight:800;color:var(--jouf-deep);line-height:1.2}
.bs{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-l{display:flex;align-items:center;gap:10px}
.up{display:flex;align-items:center;gap:8px;background:var(--jouf-soft);border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 6px}
.ua{width:30px;height:30px;border-radius:50%;background:var(--jouf);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;flex:none}
.un2{font-size:12.5px;font-weight:700;color:var(--jouf-deep);line-height:1.25}
.ur{font-size:10.5px;color:var(--muted);line-height:1.2}
.bo{padding:6px 14px;background:var(--late-soft);border:1px solid var(--late-line);border-radius:7px;color:var(--late);font-size:12px;font-weight:600;cursor:pointer}
.period{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.period select{border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--field);color:var(--ink)}
.lay{display:flex;align-items:flex-start}
.sb{width:240px;background:#fff;border-left:1px solid var(--line);padding:12px 0;flex:none;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 18px;text-decoration:none;border-right:3px solid transparent;color:var(--muted);font-size:13.5px;font-weight:500;transition:all .15s}
.nav a:hover{background:var(--jouf-soft);color:var(--jouf)}
.nav a.on{background:var(--jouf-soft);color:var(--jouf);border-right-color:var(--jouf);font-weight:700}
.nav .grp{padding:14px 18px 4px;font-size:11px;color:var(--muted);font-weight:700}
.badge{background:var(--late);color:#fff;border-radius:9px;padding:0 7px;font-size:10.5px;font-weight:700;line-height:18px;min-width:18px;text-align:center}
.badge.p{background:var(--jouf)}
.ct{flex:1;min-width:0;padding:22px 24px 60px}
.ph{margin-bottom:18px}
.ph .crumb{font-size:12px;color:var(--muted)}
.ph h1{font-size:20px;font-weight:800;color:var(--jouf-deep);margin:0}
.content{max-width:1280px}
.menu-btn{display:none}
.sb-close{display:none}
@media (max-width:1000px){.bs,.ur,.chpw-btn{display:none}}
@media (max-width:900px){
  .sb{position:fixed;top:0;right:0;height:100vh;z-index:30;transform:translateX(100%);transition:transform .2s;box-shadow:0 0 40px rgba(45,27,94,.25)}
  .sb.open{transform:none}
  .menu-btn{display:inline-flex}
  .tb{padding:0 12px}.ct{padding:16px 14px 60px}
  .period{display:none}.un2{display:none}.up{padding:3px}
}

/* ---------- blocks ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;overflow:hidden}
.panel>h3:first-child,.panel>.panel-head:first-child{margin:-16px -18px 14px;padding:12px 18px;background:var(--head);border-bottom:1px solid var(--jouf-soft)}
.panel>.panel-head:only-child{margin-bottom:-16px;border-bottom:0}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--jouf-deep)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h3{margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--jouf)}
.kpi .v{font-size:26px;font-weight:800;line-height:1.2;color:var(--jouf-deep)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi.alert::before{background:var(--late)}.kpi.alert .v{color:var(--late)}
.kpi.pend::before{background:var(--info)}
.kpi:nth-child(4)::before{background:var(--warn)}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr!important}}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:right;font-weight:700;color:var(--muted);font-size:11.5px;padding:9px 12px;border-bottom:1px solid var(--jouf-soft);background:var(--head);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid #F4F0FA;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--head)}
table.t tr.clk{cursor:pointer}
table.t tr.clk:hover td{background:var(--jouf-soft)}
.panel.tbl-wrap{padding:0}
.panel.tbl-wrap>h3:first-child,.panel.tbl-wrap>.panel-head:first-child{margin:0}
.chip{display:inline-flex;align-items:center;font-size:11px;border-radius:18px;padding:1px 10px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.c-draft{background:#F8F6FC;color:var(--muted);border-color:var(--line)}
.c-submitted,.c-in_progress{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.c-returned{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.c-approved,.c-done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.c-new{background:var(--jouf-soft);color:var(--jouf);border-color:var(--line)}
.c-cancelled{background:#F8F6FC;color:var(--muted);border-color:var(--line);text-decoration:line-through}
.c-late{background:var(--late-soft);color:var(--late);border-color:var(--late-line)}
.muted{color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F4F0FA;align-items:flex-start}
.list-row:last-child{border-bottom:0}
.list-row .t1{font-weight:600}
.list-row .t2{font-size:12.5px;color:var(--muted)}

/* ---------- org chart ---------- */
.org{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px 24px;margin-bottom:16px}
.org-top{display:flex;flex-direction:column;align-items:center}
.org-box{background:linear-gradient(135deg,var(--jouf-deep),var(--jouf));color:#fff;border-radius:9px;padding:8px 24px;font-weight:700;font-size:14.5px}
.org-stem{width:2px;height:18px;background:var(--line)}
.gov-row,.ceo-row{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;width:100%}
.gov-row>:first-child,.ceo-row>:first-child{justify-self:end}.gov-row>:last-child,.ceo-row>:last-child{justify-self:start}
.gov-node{width:280px;max-width:100%}.gov-row>.gov-node:nth-child(2){width:300px}
@media (max-width:900px){.gov-row,.ceo-row{grid-template-columns:1fr;justify-items:center}.gov-row>*,.ceo-row>*{justify-self:center!important}}
.gov-node .node{margin:0}
.gov-node.dash .node{border-style:dashed;border-right-style:solid}
.org-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative;padding-top:18px}
.org-cols::before{content:"";position:absolute;top:0;right:calc((100% - 36px)/6);left:calc((100% - 36px)/6);height:2px;background:var(--line)}
.org-col{position:relative}
.org-col::before{content:"";position:absolute;top:-18px;right:50%;width:2px;height:18px;background:var(--line)}
.org-head{text-align:center;border:1.5px solid var(--jouf);color:var(--jouf);border-radius:9px;padding:7px 10px;font-weight:700;font-size:13px;margin-bottom:10px;background:var(--jouf-soft)}
.node{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-right:4px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:7px;background:#fff;transition:all .15s}
.node:hover{border-color:var(--jouf);background:var(--head)}
.node.s-ok{border-right-color:var(--ok)}
.node.s-idle{border-right-color:#D97706}
.node.s-late{border-right-color:var(--late)}
.node.child{margin-right:18px;position:relative}
.node.child::before{content:"";position:absolute;right:-13px;top:-8px;width:8px;height:26px;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-right-radius:4px}
.node .nm{font-weight:700;font-size:13px;line-height:1.4;color:var(--jouf-deep)}
.node .mt{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.node .mt span{font-size:10.5px;color:var(--muted);background:#F8F6FC;border:1px solid var(--line-2);border-radius:18px;padding:0 7px;font-weight:600}
.node .mt span.r{color:var(--late);background:var(--late-soft);border-color:var(--late-line)}
.node .mt span.p{color:var(--info);background:var(--info-soft);border-color:var(--info-line)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px;vertical-align:-1px}
@media (max-width:900px){.org-cols{grid-template-columns:1fr;padding-top:0}.org-cols::before,.org-col::before{display:none}}

/* ---------- unit page ---------- */
.unit-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.unit-head .meta{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 16px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600;font-size:13.5px;white-space:nowrap}
.tabs a.on{color:var(--jouf);border-bottom-color:var(--jouf);font-weight:700}
.task{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #F4F0FA;align-items:flex-start}

.task .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--jouf-soft);color:var(--jouf);display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1px solid var(--line)}
.task .tx{flex:1;font-size:13.5px}
.cov{flex:none;font-size:11px;border-radius:18px;padding:1px 9px;white-space:nowrap;font-weight:700;border:1px solid}
.cov.y{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.cov.n{background:#F8F6FC;color:var(--muted);border-color:var(--line);border-style:dashed}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--jouf);border-radius:3px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:#fff;position:relative;overflow:hidden}
.stat .l{font-size:12px;color:var(--muted);min-height:2.6em;line-height:1.4;font-weight:500}
.stat .v{font-size:24px;font-weight:800;color:var(--jouf-deep)}
.stat input{width:100%;margin-top:6px}
.stat.auto{background:var(--head)}
.stat.auto::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--jouf)}

/* ---------- minute editor ---------- */
.ed-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
@media (max-width:800px){.ed-grid{grid-template-columns:1fr 1fr}}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
.att-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--head)}
.att-row .who{font-size:13px;font-weight:600}
.att-row .who small{color:var(--muted);display:block;font-size:11.5px;font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none;background:#fff}
.seg button{border:0;background:none;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--jouf);color:#fff}
.item{border:1px solid var(--line);border-right:4px solid var(--jouf);border-radius:var(--radius);padding:14px 16px 6px;margin-bottom:14px;background:#fff}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.item-head b{color:var(--jouf-deep)}
.dec-row{display:grid;grid-template-columns:1fr 190px 250px 34px;gap:8px;margin-bottom:8px;align-items:start}
@media (max-width:800px){.dec-row{grid-template-columns:1fr 1fr}.dec-row textarea{grid-column:1/-1}}
.dec-st{min-width:128px;min-height:34px;padding:4px 10px;font-weight:700;font-size:12.5px;border-radius:8px}
.dec-st-new{color:#723DC9;background:#F4EEFC}.dec-st-in_progress{color:#4468B6;background:#EEF3FC}.dec-st-done{color:#1F6F43;background:#EAF6EF}.dec-st-cancelled{color:#7B7F88;background:#F3F3F5}
.dec-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--head)}

.dec-del{border:1px solid var(--late-line);background:var(--late-soft);color:var(--late);border-radius:7px;padding:2px 10px;font-size:12px;cursor:pointer}
.dec-meta{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:8px}.dec-meta label span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
@media (max-width:700px){.dec-meta{grid-template-columns:1fr}}
.hdate{display:flex;gap:4px}.hdate select.inp{min-width:0;padding:6px 6px}.hd-d{flex:0 0 62px}.hd-m{flex:1 1 112px}.hd-y{flex:0 0 76px}
.flabel{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}.flabel b{color:var(--jouf)}
.up-grid .flabel{font-size:11px;margin-bottom:0}
.x{border:1px solid var(--late-line);background:var(--late-soft);border-radius:7px;height:38px;cursor:pointer;color:var(--late)}
.sticky-actions{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;z-index:4;box-shadow:0 -6px 20px rgba(107,63,160,.08);margin-bottom:calc(env(safe-area-inset-bottom,0px))}

/* ---------- formal minute document ---------- */
.doc{background:#fff;color:#1d1530;border:2px solid #4A2878;border-radius:16px;max-width:820px;margin:0 auto;padding:36px 44px;font-size:14px;line-height:1.95;box-shadow:0 4px 24px rgba(74,40,120,.12)}
.doc-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:2px solid #4A2878;padding-bottom:12px;margin-bottom:18px;font-size:12.5px}
.doc-head .r{line-height:1.7;font-weight:700}
.doc-head .c{text-align:center}
.doc-head .l{text-align:left;line-height:1.7;background:#F9F7FF;border:1px solid #D4C5E8;border-radius:8px;padding:6px 10px;justify-self:end}
.doc h2{text-align:center;font-size:17px;margin:6px 0 16px;color:#4A2878}
.doc h4{font-size:14.5px;margin:18px 0 6px;color:#4A2878;border-bottom:1px solid #D4C5E8;padding-bottom:3px}
.doc table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.doc th,.doc td{border:1px solid #CCC;padding:5px 8px;text-align:right;vertical-align:top}
.doc th{background:#4A2878;color:#fff;font-weight:700;border-color:#7B5EA7;text-align:center}
.doc th,.disc-prev th{vertical-align:middle;text-align:center}
.doc tr:nth-child(even) td{background:#F9F7FF}

const SupaStore = {
  mode:"live", sb:null,
  async init(){
    await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"; s.onload=res; s.onerror=()=>rej(new Error("تعذّر تحميل مكتبة الاتصال")); document.head.appendChild(s); });
    this.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true, storageKey:"shura-auth"}});
  },
  ck({data,error}){ if(error) throw new Error(error.message); return data; },
  async profile(uid){ const p=this.ck(await this.sb.from("profiles").select("*").eq("id",uid).single()); if(!p.is_active){ await this.sb.auth.signOut(); throw new Error("الحساب موقوف"); } return p; },
  async restore(){ const {data}=await this.sb.auth.getSession(); if(!data.session) return null; try{ return await this.profile(data.session.user.id); }catch(e){ return null; } },
  async signIn(username,password){
    const {data,error}=await this.sb.auth.signInWithPassword({email:username.trim().toLowerCase()+EMAIL_DOMAIN,password});
    if(error){ console.error("signIn:",error); if(/banned/i.test(error.message)) throw new Error("الحساب موقوف، تواصل مع منسق مجلس القسم"); if(/invalid login credentials/i.test(error.message)) throw new Error("اسم المستخدم أو كلمة المرور غير صحيحة"); throw new Error("تعذّر الدخول: "+error.message); }
    return this.profile(data.user.id);
  },
  async signOut(){ await this.sb.auth.signOut(); },
  async changePassword(pw){ const {error}=await this.sb.auth.updateUser({password:pw}); if(error) throw new Error(error.message); this.ck(await this.sb.rpc("mark_password_changed")); },
  async select(name){ return this.ck(await this.sb.from(name).select("*")); },
  async upsert(name,rows,keys=["id"]){ if(!rows.length) return; this.ck(await this.sb.from(name).upsert(rows,{onConflict:keys.join(",")})); },
  async update(name,id,patch){ this.ck(await this.sb.from(name).update(patch).eq("id",id)); },
  async remove(name,id){ this.ck(await this.sb.from(name).delete().eq("id",id)); },
  async removeWhere(name,field,value,exceptIds=[]){ let q=this.sb.from(name).delete().eq(field,value); if(exceptIds.length) q=q.not("id","in","("+exceptIds.join(",")+")"); this.ck(await q); },
  async createUser({username,full_name,role,password,units}){ this.ck(await this.sb.rpc("admin_create_user",{p_username:username,p_full_name:full_name,p_role:role,p_password:password,p_units:units})); },
  async resetPassword(id,pw){ this.ck(await this.sb.rpc("admin_reset_password",{p_user:id,p_password:pw})); },
  async updateUser({id,full_name,role,is_active,units}){ this.ck(await this.sb.rpc("admin_update_user",{p_user:id,p_full_name:full_name,p_role:role,p_active:is_active,p_units:units})); }
};

const S = { reports:[], archive:[], user:null, units:[], minutes:[], decisions:[], stats:[], settings:{}, profiles:[], access:[], view:{year:null,semester:null}, draft:null };

async function loadAll(){
  const [units,minutes,decisions,stats,settings,profiles,access] = await Promise.all(
    ["units","minutes","decisions","stats","settings","profiles","unit_access"].map(t=>Store.select(t)));
  S.units = units.sort((a,b)=>a.sort-b.sort);
  S.minutes=minutes; S.decisions=decisions; S.stats=stats; S.profiles=profiles; S.access=access;
  S.settings = Object.fromEntries(settings.map(s=>[s.key,s.value]));
  try{ S.reports = await Store.select("stat_reports"); }catch(e){ console.warn("reports",e); S.reports=[]; }
  try{ S.archive = await Store.archiveList(); }catch(e){ console.warn('archive',e); S.archive=[]; }
  if(!S.view.year){ S.view.year=S.settings.year||"1448"; S.view.semester=S.settings.semester||SEMESTERS[0]; }
}

const headTitle = u => u.members.some(m=>/رئيس/.test(m.role)) ? "رئيس" : "مشرف";
const kindWord = u => /^(ال)?مجلس/.test(u.name) ? "المجلس" : (u.kind==="committee" ? "اللجنة" : "الوحدة");
const li = n => n.startsWith("ال") ? "ل"+n.slice(1) : "ل"+n;
const unitMinutes = (uid, sem) => S.minutes.filter(m=>m.unit_id===uid && m.year===S.view.year && (!sem || m.semester===sem));
const unitDecisions = uid => S.decisions.filter(d=>d.unit_id===uid);
const deptHead = () => S.settings.head || HEAD_DEFAULT;
const deptCoord = () => S.settings.coordinator || COORD_DEFAULT;
const myUnitNames = () => S.user ? myUnits().map(id=>unitById(id)?.name).filter(Boolean) : [];
const canDec = d => canWrite(d.unit_id) || (S.user.role==="supervisor" && myUnitNames().includes(d.owner));
function councilInbox(){
  const used=new Set();
  S.minutes.filter(m=>m.unit_id==="DC").forEach(m=>(m.items||[]).forEach(it=>{ if(it.src_dec) used.add(it.src_dec); }));
  if(S.draft && S.draft.unit_id==="DC") (S.draft.items||[]).forEach(it=>{ if(it.src_dec) used.add(it.src_dec); });
  return S.decisions.filter(d=>d.to_council && d.unit_id!=="DC" && !used.has(d.id))
    .map(d=>({d,m:S.minutes.find(x=>x.id===d.minute_id),u:unitById(d.unit_id)})).filter(x=>x.m&&x.u&&x.m.status!=="returned")
    .sort((a,b)=>String(a.m.meeting_date).localeCompare(String(b.m.meeting_date)));
}
function srcNote(id){ const x=S.decisions.find(d=>d.id===id); if(!x) return ""; const m=S.minutes.find(y=>y.id===x.minute_id); const cu=unitById(x.unit_id);
  return `وارد من ${esc(cu?.name||"")}${m?` — محضرها رقم (${m.seq}) بتاريخ ${fmtH(m.meeting_date)}`:""}`; }

function unitSummary(u){
  const ms = unitMinutes(u.id, S.view.semester);
  const msY = unitMinutes(u.id);
  const ids = new Set(msY.map(m=>m.id));
  const ds = S.decisions.filter(d=>ids.has(d.minute_id));
  const late = ds.filter(isLate).length;
  const done = ds.filter(d=>d.status==="done").length;
  const active = ds.filter(d=>d.status!=="cancelled").length;
  const covered = new Set(); msY.forEach(m=>(m.items||[]).forEach(it=>{ if(it.task!==null && it.task!=="" && it.task>=0) covered.add(+it.task); }));
  const last = msY.map(m=>m.meeting_date).sort().pop();
  return { minutes:ms.length, approved:ms.filter(m=>m.status==="approved").length, pending:ms.filter(m=>m.status==="submitted").length,
           decisions:active, done, late, completion:pct(done,active), coverage:pct(covered.size,u.tasks.length), covered, last,
           state: late? "late" : (ms.length? "ok":"idle") };
}

/* ---------------- router ---------------- */
function go(h){ if(location.hash===h) render(); else location.hash=h; }
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });

function hideSplash(){ const sp=$("#splash"); if(!sp) return; sp.classList.add("out"); setTimeout(()=>sp.remove(),700); }
async function boot(){
  const minShow=new Promise(r=>setTimeout(r,SPLASH_MS));
  try{
    await Store.init();
    S.user = await Store.restore();
    if(S.user) await loadAll();
  }catch(e){ $("#app").innerHTML=`<div class="content"><div class="err">${esc(e.message)}</div></div>`; await minShow; hideSplash(); return; }
  try{ await document.fonts?.ready; }catch(e){}
  render();
  await minShow; hideSplash();
}

function render(){
  if(!S.user) return renderLogin();
  if(S.user.must_change_password) return renderForcePw();
  const [ , r, a, b] = (location.hash||"#/home").split("?")[0].split("/");
  let html="", title="", crumb="";
  try{
    switch(r){
      case "unit": ({html,title,crumb}=viewUnit(a,b||"overview")); break;
      case "minute": ({html,title,crumb}= a==="new" ? viewEditor(null,b) : (b==="edit"? viewEditor(a) : viewMinute(a))); break;
      case "minutes": ({html,title}=viewMinutesAll()); break;
      case "archive": ({html,title}=viewArchive()); break;
      case "decisions": ({html,title}=viewDecisions()); break;
      case "stats": ({html,title}=viewStats()); break;
      case "users": ({html,title}= isAdmin()? viewUsers() : viewHome()); break;
      case "settings": ({html,title}= isAdmin()? viewSettings() : viewHome()); break;
      case "units": ({html,title}=viewUnitsList()); break;
      default: ({html,title}=viewHome());
    }
  }catch(e){ console.error(e); html=`<div class="err">تعذّر عرض الصفحة: ${esc(e.message)}</div>`; }
  try{ html = summaryFor(r,a) + html; }catch(e){ console.warn(e); }
  $("#app").innerHTML = shell(html,title,crumb,r||"home");
  afterRender();
}

function orgChart(sums){
  const dc=unitById("DC");
  const col = g => {
    const us = S.units.filter(u=>u.grp===g && !u.parent);

function bindEditor(){
  const f=$("#edf"); if(!f) return; const d=S.draft;
  const attCount=()=>{ const c={present:0,absent:0,excused:0}; d.attendance.forEach(a=>c[a.state]++); $("#attc").textContent=`حاضر ${c.present} · غائب ${c.absent} · معتذر ${c.excused}`; };

  f.addEventListener("input",e=>{
    const t=e.target;
    if(t.dataset.k){ d[t.dataset.k]= t.type==="number"? +t.value : t.value; if(t.dataset.k==="meeting_date"){ const h=$("#hij"); if(h) h.textContent=t.value?weekday(t.value):"حدّد التاريخ"; } }
    else if(t.dataset.dk){ d.items[t.dataset.i].decisions[t.dataset.j][t.dataset.dk]= t.type==="checkbox"? t.checked : t.value; }
    else if(t.dataset.ik){ d.items[t.dataset.i][t.dataset.ik]= t.dataset.ik==="task"? (t.value===""?"":+t.value) : t.value;
      if(t.dataset.ik==="discussion"){ const pv=f.querySelector(`[data-prev="${t.dataset.i}"]`); if(pv) pv.innerHTML=hasTable(t.value)?`<div class="hint">معاينة المناقشة كما ستظهر في المحضر:</div>${renderRich(t.value)}`:""; } }
  });
  f.addEventListener("paste",e=>{
    const ta=e.target; if(!ta.matches||!ta.matches('textarea[data-ik="discussion"]')) return;
    const html=e.clipboardData?.getData("text/html")||"", txt=e.clipboardData?.getData("text/plain")||"";
    let out=null;
    if(/<table/i.test(html)){
      const tpl=parseMinuteTemplate(html);
      if(tpl.length && (tpl[0].discussion||tpl[0].decisions.length) && confirm(`المحتوى الملصق بصيغة محضر (${tpl.length>1?tpl.length+" موضوعات":"موضوع واحد"}). تعبئة الموضوع والمناقشة والقرارات تلقائيًا؟\n(إلغاء = لصق النص في خانة المناقشة فقط)`)){
        e.preventDefault(); const idx=+ta.dataset.i;
        tpl.forEach((x,k)=>{ if(k===0) d.items[idx]={...d.items[idx],topic:x.topic,discussion:x.discussion,decisions:[...(d.items[idx].decisions||[]).filter(z=>z.text&&z.text.trim()),...x.decisions]}; else d.items.splice(idx+k,0,{id:uuid(),task:"",...x}); });
        toast("عُبّئ البند من المحتوى الملصق، راجعه قبل الحفظ"); render(); return; }
      out=htmlToTextWithTables(html); }
    else if(/\t/.test(txt) && txt.split(/\n/).filter(l=>l.includes("\t")).length>=2) out=tabsToBlocks(txt);
    if(out==null) return;
    e.preventDefault(); insertAtCursor(ta,out); toast("نُقل الجدول، وستجد معاينته أسفل خانة المناقشة");
  });
  f.addEventListener("click",async e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.impWord!==undefined){ const i=b.dataset.impWord; const inp=document.createElement("input"); inp.type="file"; inp.accept=".docx";
      inp.onchange=async()=>{ const file=inp.files[0]; if(!file) return; if(!/\.docx$/i.test(file.name)) return toast("الملف يجب أن يكون Word بصيغة ‎.docx");
        try{ toast("جارٍ قراءة الملف…"); await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
          const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});
          const tpl=parseMinuteTemplate(r.value||"");
          if(tpl.length && (tpl[0].discussion||tpl[0].decisions.length)){
            if(!confirm(`تم التعرف على ${tpl.length>1?tpl.length+" موضوعات":"موضوع"} بصيغة محضر (الموضوع، المناقشة، القرار، الجهة ذات العلاقة).\nتعبئة ${tpl.length>1?"البنود":"البند"} تلقائيًا؟`)) return;
            const idx=+i; tpl.forEach((x,k)=>{ const it={id:uuid(),task:"",...x}; if(k===0){ d.items[idx]={...d.items[idx],topic:x.topic,discussion:x.discussion,decisions:[...(d.items[idx].decisions||[]).filter(z=>z.text&&z.text.trim()),...x.decisions]}; } else d.items.splice(idx+k,0,it); });
            toast(`عُبّئ ${tpl.length>1?tpl.length+" بنود":"البند"} من الملف، راجع المحتوى قبل الحفظ`); render(); return; }
          const txt=htmlToTextWithTables(r.value||"");
          if(!txt.trim()) return toast("لم يُعثر على نص في الملف");
          const ta=f.querySelector(`textarea[data-ik="discussion"][data-i="${i}"]`);
          if(ta.value.trim() && !confirm("خانة المناقشة فيها نص. إضافة محتوى الملف بعده؟ (إلغاء = استبدال النص)")) ta.value="";
          ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); insertAtCursor(ta,(ta.value?"\n":"")+txt);
          toast(hasTable(txt)?"نُقل محتوى الملف بجداوله، وتظهر المعاينة أسفل الخانة":"نُقل محتوى الملف"); }catch(err){ toast("تعذّرت قراءة الملف: "+err.message); } };
      inp.click(); return; }
    if(b.dataset.insTable!==undefined){ const ta=f.querySelector(`textarea[data-ik="discussion"][data-i="${b.dataset.insTable}"]`); ta.focus();
      insertAtCursor(ta,(ta.value&&!ta.value.endsWith("\n")?"\n":"")+"[جدول]\nالعنوان الأول | العنوان الثاني | العنوان الثالث\n... | ... | ...\n... | ... | ...\n[/جدول]\n"); return; }
    if(b.closest(".seg")){ const i=b.closest(".seg").dataset.att; d.attendance[i].state=b.dataset.v; b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); attCount(); return; }
    if(b.dataset.addDec!==undefined){ d.items[b.dataset.addDec].decisions.push({id:uuid(),text:"",owner:"",due_date:"",status:"new",to_council:false}); render(); return; }
    if(b.dataset.delDec){ const [i,j]=b.dataset.delDec.split(":"); d.items[i].decisions.splice(j,1); render(); return; }
    if(b.dataset.delItem!==undefined){ if(confirm("حذف هذا البند وقراراته؟")){ d.items.splice(b.dataset.delItem,1); render(); } return; }
    if(b.dataset.act==="suggest") return suggestModal();
    if(b.dataset.act==="additem"){ d.items.push({id:uuid(),topic:"",task:"",discussion:"",decisions:[]}); render(); return; }
    if(b.dataset.act==="addprev"){
      const prev=S.minutes.filter(x=>x.unit_id===d.unit_id&&x.id!==d.id&&x.meeting_date<=d.meeting_date).sort((a,b2)=>(b2.year+String(b2.seq).padStart(3,"0")).localeCompare(a.year+String(a.seq).padStart(3,"0")))[0];
      if(!prev) return toast("لا يوجد محضر سابق قبل هذا التاريخ");
      const ds=S.decisions.filter(x=>x.minute_id===prev.id);
      d.items.unshift({id:uuid(),topic:`متابعة تنفيذ قرارات الاجتماع السابق رقم (${prev.seq})`,task:"",discussion: ds.length? ds.map((x,k)=>`${k+1}. ${x.text}: ${D_STATUS[x.status]}${x.progress_note?" ("+x.progress_note+")":""}`).join("\n") : "لا توجد قرارات مسجلة في الاجتماع السابق.",decisions:[]});
      render(); return;
    }
    if(b.dataset.save==="approved") return approvalModal(d,v=>saveMinute("approved",b,v));
    if(b.dataset.save) await saveMinute(b.dataset.save,b);
  });
}
async function saveMinute(status,btn,extra){
  const d=S.draft; const u=unitById(d.unit_id);
  if(!d.meeting_date) return toast("حدّد تاريخ الاجتماع");
  if(d.items.some(it=>!it.topic.trim())) return toast("اكتب موضوع كل بند أو احذف البند الفارغ");
  if(S.minutes.some(m=>m.unit_id===d.unit_id&&m.year===d.year&&m.seq===d.seq&&m.id!==d.id)) return toast(`يوجد محضر برقم ${d.seq} لهذه الجهة في ${d.year}هـ`);
  if(status!=="draft" && !d.attendance.some(a=>a.state==="present")) return toast("سجّل الحضور قبل الرفع");
  btn.disabled=true;
  try{
    const id=d.id||uuid();
    const row={id,unit_id:d.unit_id,year:d.year,semester:d.semester,seq:d.seq,ref:`${u.id}-${d.year}-${String(d.seq).padStart(2,"0")}`,meeting_date:d.meeting_date,start_time:d.start_time,end_time:d.end_time,
      place:d.place,mode:d.mode,attendance:d.attendance,guests:d.guests,items:d.items.map(({decisions,...it})=>it),status,review_note: status==="draft"? (d.review_note||null) : null};
    if(!d.id){ row.created_by=S.user.id; }
    if(extra) Object.assign(row,extra);
    if(Store.mode==="demo" && status==="approved"){ row.approved_by=S.user.id; row.approved_at=new Date().toISOString(); }
    await Store.upsert("minutes",[row]);
    const decs=[]; d.items.forEach((it,i)=>(it.decisions||[]).forEach(x=>{ if(x.text&&x.text.trim()) decs.push({id:x.id||uuid(),minute_id:id,unit_id:d.unit_id,item_idx:i,text:x.text.trim(),owner:x.owner||null,due_date:x.due_date||null,status:x.status||"new",progress_note:x.progress_note||null,to_council:!!x.to_council}); }));
    await Store.removeWhere("decisions","minute_id",id,decs.map(x=>x.id));
    await Store.upsert("decisions",decs);
    await loadAll(); S.draft=null;
    toast(status==="draft"?"حُفظت المسودة":status==="approved"?"حُفظ المحضر واعتُمد":"رُفع المحضر لرئيس القسم للاعتماد");
    go("#/minute/"+id);
  }catch(e){ toast("تعذّر الحفظ: "+e.message); btn.disabled=false; }
}

async function setMinuteStatus(id,status,note,extra){

const BRANCHES=[["M","الطلاب"],["F","الطالبات"]];
const R_STATUS={none:"لم يبدأ",draft:"مسودة",submitted:"بانتظار الاعتماد",returned:"معاد للتعديل",approved:"معتمد"};

const repStatus=(uid,sem)=>reportOf(uid,sem)?.status||"none";
const byBranch=u=>(u.stats||[]).some(d=>d.by==="branch");
function indTotal(u,d,sem){
  if(d.by!=="branch") return statVal(u.id,d.key,sem);
  const v=BRANCHES.map(([b])=>statVal(u.id,d.key+"@"+b,sem)).filter(x=>x!=null&&x!=="");
  if(!v.length) return null; const n=v.map(Number);
  return d.unit==="%"? Math.round(n.reduce((a,b)=>a+b,0)/n.length*10)/10 : n.reduce((a,b)=>a+b,0);
}
const fmtV=(v,d)=>v==null||v===""?'<span class="muted">—</span>':`${Number(v).toLocaleString("en-US",{maximumFractionDigits:1})}${d.unit==="%"?"%":""}`;
const groupsOf=u=>{ const g=[]; (u.stats||[]).forEach(d=>{ const k=d.group||"المؤشرات"; let x=g.find(y=>y.name===k); if(!x) g.push(x={name:k,items:[]}); x.items.push(d); }); return g; };
const semCode=s=>"s"+(SEMESTERS.indexOf(s)+1);

    ${groupsOf(u).map(g=>`<tr class="st-g"><td colspan="${BRANCHES.length+2}">${esc(g.name)}</td></tr>`+g.items.map(d=>`<tr data-ind="${d.key}" data-pct="${d.unit==="%"?1:0}"><td>${esc(d.label)}${d.unit==="%"?' <span class="hint">(%)</span>':""}</td>
      ${BRANCHES.map(([b])=>{ const v=statVal(u.id,d.key+"@"+b); return `<td class="c">${editable?inp(d.key+"@"+b,v,d):fmtV(v,d)}</td>`; }).join("")}
      <td class="c st-tot"><b>${fmtV(indTotal(u,d),d)}</b></td></tr>`).join("")).join("")}
    </tbody></table></div>`;

  return groupsOf(u).map(g=>`<div class="st-gt">${esc(g.name)}</div><div class="stat-grid">${g.items.map(d=>{ const v=statVal(u.id,d.key); return `<div class="stat"><div class="l">${esc(d.label)}${d.unit==="%"?" (%)":""}</div>${editable?inp(d.key,v,d):`<div class="v">${fmtV(v,d)}</div>`}</div>`; }).join("")}</div>`).join("");

async function saveReport(u,status,note){
  const f=$("#statf"); const year=S.view.year, semester=S.view.semester; const rep=reportOf(u.id);
  try{
    if(f && f.querySelector(".st-in")){
      const rows=[...f.querySelectorAll(".st-in")].map(i=>({unit_id:u.id,year,semester,key:i.name,value:i.value===""?null:+i.value,updated_by:S.user.id,updated_at:new Date().toISOString()}));
      const bad=rows.find(r=>r.value!=null&&(isNaN(r.value)||r.value<0)); if(bad) return toast("القيم يجب أن تكون أرقامًا موجبة");
      await Store.upsert("stats",rows,["unit_id","year","semester","key"]);
    }
    let files=[...(rep?.files||[])];
    const fin=f?.querySelector("[name=evidence]");
    for(const file of (fin?[...fin.files]:[])){
      if(file.size>25*1048576){ toast(`«${file.name}» أكبر من 25 م.ب`); continue; }
      const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
      const path=`${u.id}/evidence/${year}-${semCode(semester)}/${uuid()}.${ext}`;
      await Store.fileUpload(path,file); files.push({path,name:file.name,size:file.size,type:file.type||ext});
    }
    const row={unit_id:u.id,year,semester,status,files,updated_at:new Date().toISOString()};
    const ach=f?.querySelector("[name=achievements]"); if(ach) row.achievements=ach.value;
    if(status==="submitted"){ row.submitted_by=S.user.id; row.submitted_at=new Date().toISOString(); row.review_note=null; }
    if(status==="returned") row.review_note=note||null;
    if(Store.mode==="demo"&&status==="approved"){ row.approved_by=S.user.id; row.approved_at=new Date().toISOString(); }
    if(status!=="approved"&&rep?.status==="approved"){ row.approved_by=null; row.approved_at=null; }
    await Store.upsert("stat_reports",[row],["unit_id","year","semester"]);
    await loadAll(); toast({draft:rep?.status==="submitted"?"سُحبت الإحصائيات للتعديل":"حُفظت المسودة",submitted:"رُفعت الإحصائيات للاعتماد",approved:"اعتُمدت الإحصائيات",returned:"أُعيدت للتعديل"}[status]); render();
  }catch(err){ toast("تعذّر الحفظ: "+err.message); }
}
function bindReport(){
  const f=$("#statf"); if(!f) return; const u=unitById(f.dataset.unit); const rep=reportOf(u.id);
  f.addEventListener("input",e=>{ const tr=e.target.closest("tr[data-ind]"); if(!tr) return;
    const v=[...tr.querySelectorAll(".st-in")].map(i=>i.value).filter(x=>x!=="").map(Number); const pctRow=tr.dataset.pct==="1";
    const tot=v.length? (pctRow? Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10 : v.reduce((a,b)=>a+b,0)) : null;
    tr.querySelector(".st-tot").innerHTML=`<b>${tot==null?"—":tot.toLocaleString("en-US",{maximumFractionDigits:1})+(pctRow?"%":"")}</b>`; });
  f.addEventListener("click",async e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.evOpen!==undefined){ const fl=rep.files[+b.dataset.evOpen]; const w=window.open("","_blank"); try{ const url=await Store.fileUrl(fl.path); if(w) w.location=url; }catch(err){ if(w) w.close(); toast(err.message); } return; }
    if(b.dataset.evDel!==undefined){ const i=+b.dataset.evDel; const fl=rep.files[i]; if(!confirm(`حذف الشاهد «${fl.name}»؟`)) return;
      try{ await Store.fileDelete(fl.path); const files=rep.files.filter((_,k)=>k!==i); await Store.upsert("stat_reports",[{unit_id:u.id,year:rep.year,semester:rep.semester,status:rep.status,files}],["unit_id","year","semester"]); await loadAll(); render(); }catch(err){ toast(err.message); } return; }
    const a=b.dataset.rep; if(!a) return;
    const cur=rep?.status||"draft";
    if(a==="save") return saveReport(u, isAdmin()? (cur==="none"?"draft":cur) : (cur==="returned"?"returned":"draft"));
    if(a==="submit"){ if(!confirm("رفع إحصائيات الفصل للاعتماد؟ لن تتمكن من تعديلها بعد الرفع إلا إذا أُعيدت إليك.")) return; return saveReport(u,"submitted"); }
    if(a==="approve"){ if(!confirm("اعتماد إحصائيات هذا الفصل؟ ستظهر النتائج للرئيس التنفيذي ونائبه.")) return; return saveReport(u,"approved"); }
    if(a==="withdraw"){ if(!confirm("سحب الإحصائيات من الاعتماد وإرجاعها مسودة للتعديل؟")) return; return saveReport(u,"draft"); }
    if(a==="unapprove"){ if(!confirm("إلغاء اعتماد الإحصائيات؟")) return; return saveReport(u,"submitted"); }
    if(a==="return"){ modal(`<h3>إعادة الإحصائيات للتعديل</h3><form id="rrf"><label class="f"><span>ملاحظاتك لرئيس ${kindWord(u)}</span><textarea class="inp" name="n" required></textarea></label><div class="acts"><button class="btn primary">إعادة</button><button type="button" class="btn" data-close>إلغاء</button></div></form>`);
      $("#rrf").onsubmit=ev=>{ ev.preventDefault(); const n=ev.target.n.value; closeModal(); saveReport(u,"returned",n); }; }
  });
}

function resultCard(u){

const TBL_RE=/\[جدول(?::(\d+))?\]\n?([\s\S]*?)\n?\[\/جدول\]/g;
const SPAN_C="<<", SPAN_R="^^";
function tableBlockHTML(body,hdr,cls){
  const rows=body.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>l.split("|").map(c=>c.trim()));
  if(!rows.length) return "";
  const n=Math.max(...rows.map(r=>r.length)); rows.forEach(r=>{ while(r.length<n) r.push(""); });
  const h=Math.max(1,Math.min(rows.length,+hdr||1));
  let html=`<table class="${cls||""}">`;
  rows.forEach((r,ri)=>{
    if(ri===0) html+="<thead>"; if(ri===h) html+="<tbody>";
    html+="<tr>";
    for(let ci=0;ci<n;ci++){
      const v=r[ci]; if(v===SPAN_C||v===SPAN_R) continue;
      let cs=1; while(ci+cs<n && r[ci+cs]===SPAN_C) cs++;
      let rs=1; while(ri+rs<rows.length && rows[ri+rs][ci]===SPAN_R) rs++;
      const tag=ri<h?"th":"td";
      html+=`<${tag}${cs>1?` colspan="${cs}"`:""}${rs>1?` rowspan="${rs}"`:""}>${esc(v)}</${tag}>`;
    }
    html+="</tr>"; if(ri===h-1) html+="</thead>";
  });
  return html+(rows.length>h?"</tbody>":"")+"</table>";
}
function renderRich(text){
  const t=String(text||""); let out="", last=0, m; TBL_RE.lastIndex=0;
  while((m=TBL_RE.exec(t))){ const before=t.slice(last,m.index).trim(); if(before) out+=`<div style="white-space:pre-line">${esc(before)}</div>`; out+=tableBlockHTML(m[2],m[1]); last=m.index+m[0].length; }
  const rest=t.slice(last).trim(); if(rest) out+=`<div style="white-space:pre-line">${esc(rest)}</div>`;
  return out;
}
const hasTable=t=>{ TBL_RE.lastIndex=0; return TBL_RE.test(String(t||"")); };
function rowsToBlock(rows,hdr){ const cl=c=>(c===SPAN_C||c===SPAN_R)?c:String(c).replace(/\|/g,"/").replace(/\s+/g," ").trim();
  return `[جدول${hdr>1?":"+hdr:""}]\n`+rows.map(r=>r.map(cl).join(" | ")).join("\n")+"\n[/جدول]"; }
function tableToGrid(tb,tf){ tf=tf||(el=>el.textContent);
  const grid=[]; let hdr=1; const trs=[...tb.rows];
  trs.forEach((tr,r)=>{ grid[r]=grid[r]||[]; let c=0;
    [...tr.cells].forEach(td=>{ while(grid[r][c]!==undefined) c++;
      const rs=Math.max(1,td.rowSpan||1), cs=Math.max(1,td.colSpan||1);
      for(let i=0;i<rs;i++){ grid[r+i]=grid[r+i]||[]; for(let j=0;j<cs;j++){ grid[r+i][c+j]= (i===0&&j===0)? tf(td) : (i===0?SPAN_C:SPAN_R); } }
      if(r===0) hdr=Math.max(hdr,rs);
      c+=cs; }); });
  const thead=tb.tHead?tb.tHead.rows.length:0; if(thead>hdr) hdr=thead;
  const n=Math.max(0,...grid.map(r=>r.length));
  const rows=grid.slice(0,trs.length).map(r=>Array.from({length:n},(_,k)=>r[k]===undefined?"":r[k]));
  return {rows:rows.filter(r=>r.some(c=>String(c).trim()&&c!==SPAN_C&&c!==SPAN_R)||true), hdr:Math.min(hdr,rows.length)};
}
function cellLine(el){ return textOf(el).replace(/\s+/g," ").trim(); }
function isLayoutTable(tb){
  if(tb.querySelector("table")) return true;
  return [...tb.rows].some(tr=>[...tr.cells].some(td=>(td.textContent||"").replace(/\s+/g," ").length>200 || td.querySelectorAll("p,li").length>6));
}
function textOf(node){
  if(node.nodeType===3) return node.nodeValue;
  if(node.nodeType!==1) return "";
  const tag=node.tagName.toLowerCase();
  if(["style","script","meta","link","title"].includes(tag)) return "";

  if(tag==="table"){
    if(isLayoutTable(node)) return "\n"+[...node.rows].map(tr=>{ const cells=[...tr.cells].map(td=>textOf(td).trim()).filter(c=>c&&!/^\d{1,2}$/.test(c));
      return cells.length>1 && cells[0].length<60 && !cells[0].includes("\n") ? cells[0]+":\n"+cells.slice(1).join("\n") : cells.join("\n"); }).join("\n\n")+"\n";
    const {rows,hdr}=tableToGrid(node,cellLine); return "\n"+rowsToBlock(rows,hdr)+"\n";
  }
  let inner=[...node.childNodes].map(textOf).join("");
  if(tag==="li") inner="• "+inner.trim();
  if(["p","div","li","h1","h2","h3","h4","h5","h6","tr","ul","ol"].includes(tag)) inner=inner+"\n";
  return inner;
}
function tidyText(t){ return t.replace(/\u00a0/g," ").replace(/[ \t]+\n/g,"\n").replace(/\n[ \t]+/g,"\n").replace(/\n{3,}/g,"\n\n").trim(); }
function htmlToTextWithTables(html){ const doc=new DOMParser().parseFromString(html,"text/html"); return tidyText(textOf(doc.body)); }
function parseMinuteTemplate(html){
  const doc=new DOMParser().parseFromString(html,"text/html"); const items=[]; let cur=null;
  const lab=t=>normAr(t).replace(/[\d:/\\\-\s]+/g," ").trim();
  doc.body.querySelectorAll("table").forEach(tb=>{ if(tb.parentElement&&tb.parentElement.closest("table")) return;
    [...tb.rows].forEach(tr=>{
      const cells=[...tr.cells].map(td=>({td,txt:tidyText(textOf(td))})).filter(c=>c.txt&&!/^\d{1,2}$/.test(c.txt));
      if(cells.length<2) return;
      const L=cells[0], content=cells.slice(1).map(c=>c.txt).join("\n"), k=lab(L.txt);
      if(L.txt.length>70) return;
      if(/^الموضوع/.test(k)&&!/مناقش|وصف/.test(k)){ cur={topic:content.replace(/\s+/g," ").trim(),discussion:"",decisionText:"",basis:"",owner:""}; items.push(cur); return; }
      if(!cur) return;
      if(/مناقش|ملخص|وصف/.test(k)) cur.discussion+=(cur.discussion?"\n":"")+content;
      else if(/قرار|توصي/.test(k)&&!/مستند|سند/.test(k)) cur.decisionText+=(cur.decisionText?"\n":"")+content;
      else if(/مستند|سند/.test(k)) cur.basis+=(cur.basis?"\n":"")+content;
      else if(/جهه|جهة|علاق/.test(k)) cur.owner=content.replace(/\s+/g," ").trim();
    });
  });
  return items.filter(x=>x.topic).map(x=>{
    const lines=x.decisionText.split("\n").map(l=>l.trim()).filter(Boolean);
    const numbered=lines.filter(l=>/^(\d+|[٠-٩]+)\s*[\.\-)]/.test(l)||/^[•\-]/.test(l));
    const decs=(numbered.length?numbered.map(l=>l.replace(/^(\d+|[٠-٩]+)\s*[\.\-)]\s*|^[•\-]\s*/,"")):(lines.filter(l=>!/:\s*$/.test(l)).length?[lines.filter(l=>!/:\s*$/.test(l)).join(" ")]:[]))
      .map(t=>({id:uuid(),text:t,owner:x.owner,due_date:"",status:"new"}));
    let disc=x.discussion; if(x.basis) disc+=(disc?"\n\n":"")+"مستند القرار/التوصية: "+x.basis.replace(/\s*\n\s*/g," ");
    return {topic:x.topic,discussion:disc,decisions:decs};
  });
}
function tabsToBlocks(text){
  const lines=text.split(/\r?\n/); const out=[]; let buf=[];
  const flush=()=>{ if(buf.length>=2) out.push(rowsToBlock(buf.map(l=>l.split("\t")))); else out.push(...buf); buf=[]; };
  lines.forEach(l=>{ if(l.includes("\t")) buf.push(l); else { flush(); out.push(l); } }); flush();
  return out.join("\n");
}

  const su=units.filter(u=>(u.stats||[]).length); const rc={none:0,draft:0,submitted:0,returned:0,approved:0}; su.forEach(u=>rc[repStatus(u.id)]++);
  const apP=pct(rc.approved,su.length);
  const repW=widget("chart","الإحصائيات الفصلية",`${esc(sem)} ${yr}هـ`,
    `<div class="wd-row">${ring(apP,pctColor(apP),130,"معتمدة")}<div class="mini3">

    const ss=us.map(u=>sums[u.id]); const dTot=ss.reduce((a,s)=>a+s.decisions,0), dDone=ss.reduce((a,s)=>a+s.done,0);
    const cov=Math.round(ss.reduce((a,s)=>a+s.coverage,0)/ss.length); const met=pct(ss.filter(s=>s.minutes).length,ss.length);
    return {name:info.title,comp:dTot?pct(dDone,dTot):null,cov,met}; }).filter(Boolean);

  if(S.user.role==="supervisor"){

    const kp=`<div class="kcs">
      ${kpiCard("file",DC.green,semMin.length,`محاضر ${esc(sem)}`,`${semMin.filter(m=>m.status==="approved").length} معتمد منها`,"#/minutes")}
      ${kpiCard("pause",DC.orange,drafts,"مسودات لم تُرفع","أكملها وارفعها لرئيس القسم","#/minutes?status=draft")}
      ${kpiCard("alert",DC.red,late,"قرارات متأخرة","تجاوزت موعد التنفيذ","#/decisions?late=1")}
      ${kpiCard("grid",pctColor(covP),covP+"%","تغطية المهام",`في محاضر ${yr}هـ`)}</div>`;
    const repRows=su.map(u=>{ const st=repStatus(u.id); const req=(u.stats||[]).length; const filled=(u.stats||[]).filter(dd=>indTotal(u,dd)!=null).length;
      return {u,st,p:pct(filled,req),filled,req}; });
    const fillP=repRows.length?Math.round(repRows.reduce((x,r)=>x+r.p,0)/repRows.length):0;
    const myRepW=widget("chart","إحصائيات الفصل",`${esc(sem)} ${yr}هـ`,
      repRows.length? `<div class="wd-row">${ring(fillP,pctColor(fillP),130,"مكتمل")}<div class="mini3">${repRows.map(r=>`<a class="mc" style="text-decoration:none;color:inherit" href="#/stats?unit=${r.u.id}"><b style="font-size:14px">${esc(r.u.name)}</b><small>${r.filled} من ${r.req} مؤشر · </small><span class="chip c-${r.st==="none"?"draft":r.st}">${R_STATUS[r.st]}</span></a>`).join("")}</div></div>`
      : `<div class="empty">لا توجد إحصائيات مطلوبة.</div>`, `<a class="wd-a" href="#/stats">إدخال الإحصائيات ‹</a>`);
    const unc=[]; units.forEach(u=>u.tasks.forEach((t,i)=>{ if(!sums[u.id].covered.has(i)&&!/ما يحال/.test(t)) unc.push({u,t,i}); }));
    const covW2=widget("grid","مهام لم تُناقش بعد",`من مهام قرار التشكيل · ${yr}هـ`,
      `<div class="wd-row wd-top">${ring(covP,pctColor(covP),120,"تغطية")}<div class="unc">${unc.slice(0,6).map(x=>`<div class="unc-r"><span class="task-no">${x.i+1}</span><span>${esc(x.t.length>110?x.t.slice(0,110)+"…":x.t)}</span></div>`).join("")||'<div class="hint">نوقشت كل المهام هذا العام 👏</div>'}${unc.length>6?`<div class="hint">و${unc.length-6} مهام أخرى</div>`:""}</div></div>`,
      units.length===1?`<a class="wd-a" href="#/minute/new/${units[0].id}">محضر جديد ‹</a>`:"");
    return kp+`<div class="wds3">${minW}${decW}${myRepW}</div><div class="wds2" style="grid-template-columns:1fr">${covW2}</div>`;
  }
  return kpis+`<div class="wds3">${minW}${decW}${repW}</div><div class="wds2">${perfW}${covW}</div>`;
}

/* ---------------- page summaries ---------------- */
function summaryFor(r,a){
  const units=visibleUnits(), ids=new Set(units.map(u=>u.id)), yr=S.view.year, sem=S.view.semester;
  const wrap=cards=>`<div class="kcs">${cards.join("")}</div>`;
  if(r==="units"){
    const sums=units.map(u=>unitSummary(u)); const met=sums.filter(s=>s.minutes).length;
    const cov=Math.round(sums.reduce((x,s)=>x+s.coverage,0)/(sums.length||1)); const late=sums.reduce((x,s)=>x+s.late,0);
    return wrap([kpiCard("grid",DC.purple,units.length,S.user.role==="supervisor"?"لجاني":"المجلس واللجان","وفق الهيكل التنظيمي"),
      kpiCard("check",DC.green,`${met}<small> / ${units.length}</small>`,"اجتمعت هذا الفصل",esc(sem)),
      kpiCard("chart",pctColor(cov),cov+"%","متوسط تغطية المهام",`في محاضر ${yr}هـ`),
      kpiCard("alert",DC.red,late,"قرارات متأخرة","تجاوزت موعد التنفيذ","#/decisions?late=1")]);
  }
  if(r==="unit"){
    const u=unitById(a); if(!u||!units.includes(u)) return ""; const s=unitSummary(u); const st=repStatus(u.id);
    return wrap([kpiCard("file",DC.green,s.minutes,"محاضر الفصل",`${s.approved} معتمد · ${esc(sem)}`,`#/unit/${u.id}/minutes`),
      kpiCard("check",pctColor(s.completion),s.decisions?s.completion+"%":"—","تنفيذ القرارات",`${s.done} من ${s.decisions} قرار`,`#/unit/${u.id}/decisions`),
      kpiCard("alert",DC.red,s.late,"قرارات متأخرة","تجاوزت موعدها",`#/unit/${u.id}/decisions`),
      kpiCard("grid",pctColor(s.coverage),s.coverage+"%","تغطية المهام",`${s.covered.size} من ${u.tasks.length} مهمة`,`#/unit/${u.id}/overview`),
      ...((u.stats||[]).length?[kpiCard("chart",st==="approved"?DC.green:st==="submitted"?DC.blue:st==="returned"?DC.amber:DC.orange,R_STATUS[st],"الإحصائيات الفصلية",esc(sem),`#/unit/${u.id}/stats`)]:[])]);
  }
  if(r==="minutes"){
    const ms=S.minutes.filter(m=>ids.has(m.unit_id)&&m.year===yr); const c=k=>ms.filter(m=>m.status===k).length;
    return wrap([kpiCard("file",DC.purple,ms.length,"محاضر العام",`${yr}هـ`),kpiCard("check",DC.green,c("approved"),"معتمدة",pct(c("approved"),ms.length)+"% من المحاضر"),
      kpiCard("clock",DC.blue,c("submitted"),"بانتظار الاعتماد","مرفوعة للاعتماد"),kpiCard("pause",DC.orange,c("draft")+c("returned"),"مسودات ومعادة","لم تكتمل بعد")]);
  }
  if(r==="archive"){
    const A=S.archive.filter(x=>ids.has(x.unit_id)); const yrs=new Set(A.map(x=>x.year)); const us=new Set(A.map(x=>x.unit_id));
    return wrap([kpiCard("archive",DC.purple,A.length,"محاضر مؤرشفة","1444 – 1448هـ"),kpiCard("check",DC.green,A.filter(x=>x.has_text).length,"قابلة للبحث في نصها","ملفات Word و PDF نصية"),
      kpiCard("file",DC.orange,A.filter(x=>!x.has_text).length,"ممسوحة ضوئيًا","البحث فيها بالعنوان"),kpiCard("grid",DC.blue,`${us.size}<small> / ${units.length}</small>`,"جهات لها أرشيف",`${yrs.size} ${yrs.size>10||yrs.size<3?"عام":"أعوام"} مغطاة`)]);
  }
  if(r==="decisions"){
    const ds=S.decisions.filter(d=>ids.has(d.unit_id)&&S.minutes.some(m=>m.id===d.minute_id&&m.year===yr)); const act=ds.filter(d=>d.status!=="cancelled");
    const done=act.filter(d=>d.status==="done").length;
    return wrap([kpiCard("check",DC.purple,ds.length,"قرارات العام",`${yr}هـ`),kpiCard("chart",pctColor(pct(done,act.length)),pct(done,act.length)+"%","نسبة التنفيذ",`${done} قرار منفّذ`),
      kpiCard("clock",DC.blue,act.filter(d=>d.status==="in_progress").length,"قيد التنفيذ","جارٍ العمل عليها"),kpiCard("alert",DC.red,ds.filter(isLate).length,"متأخرة","تجاوزت موعدها","#/decisions?late=1")]);
  }
  if(r==="users"&&isAdmin()){
    const P=S.profiles; return wrap([kpiCard("users",DC.purple,P.length,"إجمالي الحسابات",`${P.filter(p=>p.role==="supervisor").length} حساب لجنة`),
      kpiCard("check",DC.green,P.filter(p=>p.is_active&&!p.must_change_password).length,"نشطة","دخل أصحابها وغيّروا كلمة المرور"),
      kpiCard("clock",DC.amber,P.filter(p=>p.is_active&&p.must_change_password).length,"بانتظار أول دخول","لم يُستخدم الحساب بعد"),
      kpiCard("pause",DC.red,P.filter(p=>!p.is_active).length,"موقوفة","لا يمكنها الدخول")]);
  }
  if(r==="settings"&&isAdmin()){
    return wrap([kpiCard("grid",DC.purple,S.units.length,"المجلس واللجان","في الهيكل التنظيمي"),kpiCard("check",DC.blue,S.units.reduce((x,u)=>x+u.tasks.length,0),"المهام","من قرارات التشكيل"),
      kpiCard("chart",DC.green,S.units.reduce((x,u)=>x+(u.stats||[]).length,0),"المؤشرات المطلوبة","الإحصائيات الفصلية"),kpiCard("users",DC.orange,S.units.reduce((x,u)=>x+u.members.length,0),"عضوية","في التشكيلات")]);
  }
  return "";
}

/* ---------------- Quran channel mini player ---------------- */
const QURAN_SOURCES=[
  {t:"البث الرسمي لقناة القرآن الكريم (HLS)",u:"https://win.holol.com/live/quran/playlist.m3u8"},
  {t:"صفحة البث على Makkah Live",u:"https://makkahlive.net/tvquran.aspx"}
];
const quranHidden=()=>{ try{ const v=JSON.parse(S.settings.quran_hidden||"[]"); return Array.isArray(v)?v:[]; }catch(e){ return []; } };
const showQuran=()=>isAdmin()||!quranHidden().includes(S.user?.id);
const quranSrc=()=> (S.settings&&S.settings.quran_src) || QURAN_SOURCES[0].u;
let qHls=null;
function ytEmbed(u){ let m=u.match(/[?&]v=([\w-]{6,})/)||u.match(/youtu\.be\/([\w-]{6,})/)||u.match(/youtube\.com\/(?:live|embed)\/([\w-]{6,})/); if(m) return `https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1`; m=u.match(/channel\/(UC[\w-]+)/); if(m) return `https://www.youtube.com/embed/live_stream?channel=${m[1]}&autoplay=1&mute=1`; return null; }
function qFail(msg){ const b=$("#qbody"); if(!b) return; b.innerHTML=`<div class="q-err">${esc(msg)}<br><a href="${esc(quranSrc())}" target="_blank" rel="noopener">فتح في نافذة جديدة</a>${isAdmin()?`<a href="#/settings">تغيير المصدر</a>`:""}</div>`; }
async function quranOpen(){
  let d=$("#qdock"); if(!d){ d=document.createElement("div"); d.id="qdock"; document.body.appendChild(d); }
  const u=quranSrc();
  d.innerHTML=`<div class="q-head"><span><i class="live-dot"></i> قناة القرآن الكريم · مباشر</span><span><button type="button" data-q="big" title="تكبير">⤢</button><button type="button" data-q="close" title="إغلاق">✕</button></span></div><div id="qbody" class="q-body"><div class="q-err">جارٍ تشغيل البث…</div></div>`;
  d.classList.add("on"); document.body.classList.add("q-open");
  d.onclick=e=>{ const b=e.target.closest("[data-q]"); if(!b) return; if(b.dataset.q==="close") quranClose(); if(b.dataset.q==="big") d.classList.toggle("big"); };
  const body=$("#qbody");
  if(/\.m3u8(\?|$)/i.test(u)){
    body.innerHTML=`<video id="qvid" controls autoplay muted playsinline></video>`; const v=$("#qvid");
    const to=setTimeout(()=>{ if(v.readyState<2) qFail("تعذّر تشغيل البث على هذه الشبكة، ربما بسبب الحجب."); },15000);
    v.addEventListener("playing",()=>clearTimeout(to),{once:true});
    if(v.canPlayType("application/vnd.apple.mpegurl")){ v.src=u; v.onerror=()=>{ clearTimeout(to); qFail("تعذّر تشغيل البث على هذه الشبكة، ربما بسبب الحجب."); }; return; }
    try{ await loadScript("https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"); }catch(e){ clearTimeout(to); return qFail("تعذّر تحميل مشغل البث."); }
    if(!window.Hls||!Hls.isSupported()){ clearTimeout(to); return qFail("المتصفح لا يدعم هذا النوع من البث."); }
    qHls=new Hls(); qHls.loadSource(u); qHls.attachMedia(v);
    qHls.on(Hls.Events.ERROR,(_,data)=>{ if(data.fatal){ clearTimeout(to); qFail("تعذّر تشغيل البث على هذه الشبكة، ربما بسبب الحجب."); try{ qHls.destroy(); }catch(e){} qHls=null; } });
    return;
  }
  const yt=ytEmbed(u);
  body.innerHTML=`<iframe src="${esc(yt||u)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe><div class="q-alt"><a href="${esc(u)}" target="_blank" rel="noopener">لا يظهر البث؟ افتحه في نافذة جديدة</a></div>`;
}
function quranClose(){ try{ qHls&&qHls.destroy(); }catch(e){} qHls=null; const d=$("#qdock"); if(d){ d.classList.remove("on","big"); d.innerHTML=""; } document.body.classList.remove("q-open"); }

function defaultPhase(iso){ const mo=+(String(iso||todayISO()).slice(5,7)); return [8,9,1,2].includes(mo)?"s":[12,5,6,7].includes(mo)?"e":"m"; }
function suggestionsFor(u,d,phase){
  const year=S.settings.year||"1448", kw=kindWord(u);

  const findTask=re=>u.tasks.findIndex(t=>re.test(t));

  if(u.id==="DC"){ const ti=u.tasks.findIndex(t=>/توصيات لجان/.test(t));
    councilInbox().forEach(({d:x,m,u:cu})=>out.inbox.push({topic:`توصية ${cu.name} بشأن ${x.text.replace(/^(التوصية|توصي اللجنة)\s*ب/,"").slice(0,110)}${x.text.length>110?"…":""}`,task:ti>=0?ti:"",
      discussion:`استعرض المجلس توصية ${cu.name} الواردة في محضرها رقم (${m.seq}) بتاريخ ${fmtH(m.meeting_date)}، ونصها: «${x.text}».`,src_dec:x.id})); }
  const prev=S.minutes.filter(x=>x.unit_id===u.id&&x.id!==d.id&&x.meeting_date<=d.meeting_date).sort((a,b)=>(b.year+String(b.seq).padStart(3,"0")).localeCompare(a.year+String(a.seq).padStart(3,"0")))[0];
  if(prev){ const ds=S.decisions.filter(x=>x.minute_id===prev.id);
    out.follow.push({topic:`متابعة تنفيذ قرارات الاجتماع السابق رقم (${prev.seq})`,task:"",discussion: ds.length? ds.map((x,k)=>`${k+1}. ${x.text}: ${D_STATUS[x.status]}${x.progress_note?" ("+x.progress_note+")":""}`).join("\n") : "لا توجد قرارات مسجلة في الاجتماع السابق."}); }
  const late=S.decisions.filter(x=>x.unit_id===u.id&&isLate(x));
  if(late.length) out.follow.push({topic:`مناقشة القرارات المتأخرة عن موعد تنفيذها (${late.length} ${late.length>10||late.length<3?"قرار":"قرارات"})`,task:"",discussion:late.map((x,k)=>`${k+1}. ${x.text} (المسؤول: ${x.owner||"—"}، الموعد: ${fmtHs(x.due_date)})`).join("\n")});
  const gen=[];
  gen.push(["s",-1,`اعتماد خطة عمل ${kw} للفصل الدراسي وتوزيع المهام على الأعضاء`]);
  gen.push(["m",-1,`مراجعة مؤشرات أداء ${kw} للفصل الدراسي الحالي`]);
  const rep=findTask(/التقرير الفصلي/); gen.push(["e",rep,`مناقشة التقرير الفصلي لأعمال ${kw} واعتماده`]);
  const ref=findTask(/ما يحال/); gen.push(["a",ref,`دراسة ما يحال إلى ${kw} من جهات الاختصاص`]);
  [...(TOPIC_BANK[u.id]||[]),...gen].filter(x=>x[0]===phase||x[0]==="a").forEach(([ph,t,topic])=>{
    topic=topic.replace("{year}",year); if(!have.has(normAr(topic))) out.bank.push({topic,task:t>=0&&t<u.tasks.length?t:"",discussion:"",phase:ph}); });
  const covered=new Set(); S.minutes.filter(m=>m.unit_id===u.id&&m.year===year).forEach(m=>(m.items||[]).forEach(it=>{ if(it.task!==""&&it.task!=null) covered.add(+it.task); }));
  d.items.forEach(it=>{ if(it.task!==""&&it.task!=null) covered.add(+it.task); });
  u.tasks.forEach((t,i)=>{ if(!covered.has(i) && !/ما يحال|التقرير الفصلي|الخطة الاستراتيجية والتقرير السنوي/.test(t)) out.tasks.push({topic:t.replace(/\.$/,""),task:i,discussion:""}); });
  return out;
}

const HMONTHS=["محرم","صفر","ربيع الأول","ربيع الآخر","جمادى الأولى","جمادى الآخرة","رجب","شعبان","رمضان","شوال","ذو القعدة","ذو الحجة"];
const _hf=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"numeric",year:"numeric",timeZone:"UTC"});
const _hp=(dt)=>{ const p=_hf.formatToParts(dt); const g=k=>+((p.find(x=>x.type===k)||{}).value); return {y:g("year"),m:g("month"),d:g("day")}; };
function hParts(iso){ if(!iso) return null; try{ return _hp(new Date(String(iso).slice(0,10)+"T12:00:00Z")); }catch(e){ return null; } }
let _h2g=null;
function h2g(y,m,d){
  if(!_h2g){ _h2g={}; const t=new Date(Date.UTC(2017,0,1,12)); const end=Date.UTC(2035,11,31,12);
    for(;t.getTime()<=end;t.setUTCDate(t.getUTCDate()+1)){ const p=_hp(t); _h2g[`${p.y}-${p.m}-${p.d}`]=t.toISOString().slice(0,10); } }
  return _h2g[`${+y}-${+m}-${+d}`]||null;
}
const hMonthLen=(y,m)=>h2g(y,m,30)?30:29;
const pad2=n=>String(n).padStart(2,"0");
function fmtHs(iso){ const p=hParts(iso); return p? `${p.y}/${pad2(p.m)}/${pad2(p.d)}هـ` : "—"; }
function hijriInput(attrs,iso,opt={}){
  const p=hParts(iso)||{}; const ys=[]; for(let y=1440;y<=1452;y++) ys.push(y); if(p.y&&!ys.includes(p.y)) ys.push(p.y);
  const o=(v,l,sel)=>`<option value="${v}" ${sel?"selected":""}>${l}</option>`;
  return `<span class="hdate">
    <select class="inp hd-d" aria-label="اليوم">${opt.optional?o("","يوم",!p.d):""}${Array.from({length:30},(_,i)=>o(i+1,i+1,p.d===i+1)).join("")}</select>
    <select class="inp hd-m" aria-label="الشهر">${opt.optional?o("","الشهر",!p.m):""}${HMONTHS.map((n,i)=>o(i+1,n,p.m===i+1)).join("")}</select>
    <select class="inp hd-y" aria-label="السنة">${opt.optional?o("","السنة",!p.y):""}${ys.map(y=>o(y,y,p.y===y)).join("")}</select>
    <input type="hidden" ${attrs} value="${esc(iso||"")}"></span>`;
}
document.addEventListener("change",e=>{
  const s=e.target.closest&&e.target.closest(".hdate select"); if(!s) return;
  const w=s.closest(".hdate"), hid=w.querySelector("input[type=hidden]");
  const dS=w.querySelector(".hd-d"), mS=w.querySelector(".hd-m"), yS=w.querySelector(".hd-y");
  if(!dS.value||!mS.value||!yS.value){ hid.value=""; }
  else{ const len=hMonthLen(yS.value,mS.value); if(+dS.value>len){ dS.value=String(len); toast(`شهر ${HMONTHS[mS.value-1]} ${yS.value}هـ عدد أيامه ${len} يومًا`); }

function normAr(t){ return normArRaw(t).replace(/لا/g,"ال"); }

function tolerantPattern(w){ const esc2=c=>c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return "("+wordVariants(w).map(v=>[...v].map(esc2).join(" ?")).join("|")+")"; }

      if(c==="ا"&&cs[i+1]==="ل"){ parts.push("(?:[اأإآٱ]"+gap+"ل|ل"+gap+"[اأإآٱ])"+gap); i++; continue; }
      parts.push((map[c]||c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))+gap); }
    return parts.join("").replace(/\\s\?$/,""); };

function snippet(text,q,len=130){
  text=String(text||"").replace(/\s*\n\s*/g," ؛ ").replace(/\s{2,}/g," "); if(!q) return esc(text.slice(0,len*2));
  const m=arRegex(q).exec(text); if(!m) return esc(text.slice(0,len*2))+(text.length>len*2?"…":"");
  const a=Math.max(0,m.index-len), b=Math.min(text.length,m.index+m[0].length+len);
  return (a>0?"…":"")+esc(text.slice(a,m.index))+"<mark>"+esc(m[0])+"</mark>"+esc(text.slice(m.index+m[0].length,b))+(b<text.length?"…":"");
}

async function extractText(file){
  const name=file.name.toLowerCase();
  try{
    if(name.endsWith(".pdf")){
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; let out=[];
      for(let i=1;i<=Math.min(pdf.numPages,60);i++){ const c=await (await pdf.getPage(i)).getTextContent(); out.push(c.items.map(x=>x.str).join(" ")); }
      return fixArabicPdf(out.join("\n").replace(/[ \t]+/g," ").trim());
    }
    if(name.endsWith(".docx")){
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
      const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()}); return (r.value||"").replace(/[ \t]*\n\s*/g,"\n").trim();
    }
    if(name.endsWith(".txt")) return (await file.text()).trim();
  }catch(e){ console.warn("extract",e); }
  return "";
}

const idb = {

  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ const r=indexedDB.open("shura-archive",1); r.onupgradeneeded=()=>r.result.createObjectStore("files"); r.onsuccess=()=>{this.db=r.result;res(this.db);}; r.onerror=()=>rej(r.error); }); },
  async put(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("files","readwrite"); t.objectStore("files").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const r=db.transaction("files").objectStore("files").get(k); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async del(k){ const db=await this.open(); return new Promise(res=>{ const t=db.transaction("files","readwrite"); t.objectStore("files").delete(k); t.oncomplete=res; t.onerror=res; }); }
};

function fixArabicPdf(t){
  t=String(t||"").normalize("NFKC");
  const S='(^|[\\s(«"\'،.:؛\\-/])', A='[\\u0621-\\u064A]';
  t=t.replace(new RegExp(S+"([وبل]?)ا([مجحخه])([مجحخ])ل","g"),"$1$2ال$4$3");
  t=t.replace(new RegExp(S+"([وبل]?)ا([مجحخه])ل","g"),"$1$2ال$3");
  t=t.replace(new RegExp(S+"([وبل]?)حت(?![ىم])(?=[\\u0621-\\u064A])","g"),"$1$2تح");
  const TOK={"يف":"في","ويف":"وفي","يفه":"فيه","يفها":"فيها","يفما":"فيما","اليت":"التي","واليت":"والتي","اللوايت":"اللواتي"};
  t=t.replace(new RegExp(S+"("+Object.keys(TOK).join("|")+")(?=$|[^\\u0621-\\u064A])","g"),(m0,pre,w)=>pre+TOK[w]);
  t=t.replace(new RegExp(S+"([وبل]?)ا([أإآ])ل","g"),"$1$2ال$3");
  t=t.replace(new RegExp(S+"([وبل]?)اال","g"),"$1$2الا");
  t=t.replace(new RegExp(S+"([وبل]?)حم(ضر|اضر|مد|دد|ددة|ور|اور|ارب|افظة)(?=$|[^\\u0621-\\u064A])","g"),"$1$2مح$3");
  const W=[["اطالع","اطلاع"],["إطالع","إطلاع"],["خالل","خلال"],["عالقة","علاقة"],["عالقات","علاقات"],["صالحي","صلاحي"],["إعالن","إعلان"],["اعالن","اعلان"],
    ["مالحظ","ملاحظ"],["استالم","استلام"],["إسالم","إسلام"],["عالج","علاج"],["الئحة","لائحة"],["أخالق","أخلاق"],["اخالق","اخلاق"],["انطالق","انطلاق"],
    ["إطالق","إطلاق"],["اطالق","اطلاق"],["إخالل","إخلال"],["اخالل","اخلال"],["إالكتروني","إلكتروني"],["الالزم","اللازم"],["االزمة","اللازمة"],
    ["قرتح","قترح"],["قرتاح","قتراح"],["سرتاتيج","ستراتيج"],["لكرتون","لكترون"],["فرتة","فترة"],["فرتات","فترات"],["شرتك","شترك"],["شرتاك","شتراك"],["حرتام","حترام"],["عرتاف","عتراف"],["عرتاض","عتراض"],["عرتض","عترض"],["دفرت","دفتر"],["سرتجاع","سترجاع"],["سرتشاد","سترشاد"],["ربامج","برامج"],["ربنامج","برنامج"]];
  for(const [a,b] of W) t=t.split(a).join(b);
  t=t.replace(new RegExp("(?<="+A+"{2})االت(?="+"$|[^\\u0621-\\u064A])","g"),"الات");
  t=t.replace(new RegExp("(?<="+A+"{3})([^ا\\s])الت(?=$|[^\\u0621-\\u064A])","g"),"$1لات");
  return t;
}

  return `<div class="panel tbl-wrap"><div class="panel-head"><h3>محاضر ${kindWord(u)} السابقة (${rows.length})</h3>${canWrite(u.id)?`<button class="btn primary" data-arch="upload" data-arch-unit="${u.id}">رفع محاضر سابقة</button>`:""}</div>${archiveTable(rows)}</div>`;
}
function uploadModal(presetUnit){

  modal(`<h3>رفع محاضر سابقة</h3><form id="upf">
    <p class="hint" style="margin-top:0">اختر الجهة والعام ثم الملفات (PDF أو Word أو صور). يمكنك اختيار عدة ملفات معًا، وتُستخرج نصوصها تلقائيًا لتصبح قابلة للبحث.</p>

    <div class="acts"><button class="btn primary" id="up-go" disabled>رفع الملفات</button><button type="button" class="btn" data-close>إغلاق</button></div></form>`);
  const f=$("#upf"); let files=[];
  const rowsHTML=()=>files.map((x,i)=>`<div class="up-row" data-up="${i}"><div class="up-name">${esc(x.file.name)} <span class="hint">${fmtSize(x.file.size)}</span></div>
    <div class="up-grid"><label class="up-t"><span>عنوان المحضر</span><input class="inp" data-uk="title" value="${esc(x.title)}"></label>
      <label><span>رقم المحضر</span><input class="inp" data-uk="seq" type="number" min="1" value="${x.seq}"></label>
      <label><span>العام</span><select class="inp" data-uk="year"><option value="">—</option>${ARCH_YEARS.map(y=>`<option ${x.year===y?"selected":""}>${y}</option>`).join("")}</select></label>
      <div class="s2"><span class="flabel">تاريخ الاجتماع (هجري)</span>${hijriInput('data-uk="meeting_date"',x.meeting_date,{optional:true})}</div>
      <label class="s2"><span>رقم الاعتماد</span><input class="inp" data-uk="approval_no" value="${esc(x.approval_no||"")}" dir="ltr" placeholder="125/48"></label>
      <div class="s2"><span class="flabel">تاريخ الاعتماد (هجري)</span>${hijriInput('data-uk="approval_date"',x.approval_date,{optional:true})}</div></div>
    <div class="up-st hint">${x.st||""}</div></div>`).join("");
  f.files.onchange=()=>{ const y=f.year.value; files=[...f.files.files].map(file=>{ const g=guessFromName(file.name); return {file,title:g.title,seq:g.seq,year:y||g.year,meeting_date:"",st:""}; });
    $("#up-rows").innerHTML=rowsHTML(); $("#up-go").disabled=!files.length; $("#up-go").textContent=`رفع ${files.length} ${files.length>10||files.length<3?"ملف":"ملفات"}`; };
  f.year.onchange=()=>{ if(f.year.value){ files.forEach(x=>x.year=f.year.value); $("#up-rows").innerHTML=rowsHTML(); } };
  $("#up-rows").addEventListener("input",e=>{ const r=e.target.closest("[data-up]"); if(!r) return; files[r.dataset.up][e.target.dataset.uk]=e.target.value; });
  f.onsubmit=async e=>{ e.preventDefault();
    if(files.some(x=>!x.year)) return toast("حدّد العام لكل ملف");
    if(files.some(x=>x.file.size>25*1048576)) return toast("الحد الأقصى لحجم الملف 25 م.ب");
    for(const x of files){ const a=normApproval(x.approval_no,x.year); if(a===undefined) return toast(`رقم الاعتماد «${x.approval_no}» غير صحيح: أرقام وشرطات مائلة فقط، مثل 125/48`); x.approvalN=a; }
    const btn=$("#up-go"); btn.disabled=true; let ok=0;
    for(const [i,x] of files.entries()){
      if(x.done) continue; const st=document.querySelector(`[data-up="${i}"] .up-st`);
      try{
        st.textContent="جارٍ استخراج النص…"; const content=await extractText(x.file); const has=content.replace(/\s/g,"").length>=40;
        st.textContent="جارٍ الرفع…";
        const ext=(x.file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
        const id=uuid(); const unit=f.unit.value;
        await Store.archiveUpload({id,unit_id:unit,year:x.year,semester:f.semester.value||null,seq:x.seq?+x.seq:null,meeting_date:x.meeting_date||null,title:(x.title||x.file.name).trim(),notes:null,
          file_path:`${unit}/${x.year}/${id}.${ext}`,file_name:x.file.name,file_type:x.file.type||ext,file_size:x.file.size,approval_no:x.approvalN||null,approval_date:x.approval_date||null,content:has?content:null,search_text:normAr((x.title||"")+" "+(x.approvalN||"")+" "+(has?content:"")),has_text:has,uploaded_by:S.user.id,created_at:new Date().toISOString()},x.file);
        x.done=true; ok++; st.innerHTML=`<span style="color:var(--ok)">✓ تم${has?"، والنص قابل للبحث":"، ملف ممسوح ضوئيًا (البحث بالعنوان)"}</span>`;
      }catch(err){ st.innerHTML=`<span style="color:var(--late)">✕ ${esc(err.message)}</span>`; }
    }
    S.archive=await Store.archiveList(); btn.disabled=false; btn.textContent="إعادة المحاولة للملفات المتبقية";
    toast(`رُفع ${ok} من ${files.length}`); if(ok===files.length){ closeModal(); render(); }
  };
}

async function archOpen(id){
  const r=S.archive.find(x=>x.id===id); if(!r) return;
  const w=window.open("","_blank");
  try{ const url=await Store.archiveUrl(r); if(w) w.location=url; else location.href=url; }catch(e){ if(w) w.close(); toast(e.message); }
}
