let lastField=null;
function editorArchiveModal(unitId){
  AR.unit=unitId; AR.results=null;
  modal(`<h3>البحث في أرشيف المحاضر</h3><div style="padding-bottom:4px">
    <div class="filters" style="margin-bottom:8px"><select data-arch-f="unit" id="am-unit"><option value="">كل الجهات</option>${visibleUnits().map(u=>`<option value="${u.id}" ${AR.unit===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select>
      <select data-arch-f="year" id="am-year"><option value="">كل الأعوام</option>${ARCH_YEARS.map(y=>`<option ${AR.year===y?"selected":""}>${y}</option>`).join("")}</select></div>
    <div class="filters"><input type="text" class="inp" style="flex:1" id="am-q" placeholder="مثال: إعادة القيد، جداول الاختبارات، مذكرة تفاهم" value="${esc(AR.q)}"><button class="btn primary" id="am-go">بحث</button></div>
    <p class="hint">«إدراج المقتطف» يضيف النص المحيط بنتيجة البحث إلى آخر خانة كتبت فيها في المحضر.</p>
    <div id="am-res"></div></div>`);
  $(".modal").style.maxWidth="980px";
  const rer=()=>{ const el=$("#am-res"); if(el) el.innerHTML=archiveResultsHTML(true); };
  const go=()=>{ AR.q=$("#am-q").value.trim(); AR.unit=$("#am-unit").value; AR.year=$("#am-year").value; if(!AR.q) return toast("اكتب كلمة للبحث"); runArchiveSearch(rer); };
  $("#am-go").onclick=go; $("#am-q").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } };
  $("#am-res").onclick=async e=>{
    const o=e.target.closest("[data-arch-open]"); if(o) return archOpen(o.dataset.archOpen);
    const b=e.target.closest("[data-arch-ins]"); if(!b) return;
    const [src,id]=b.dataset.archIns.split(":");
    const text= (src==="a" ? (AR.results.arch.find(r=>r.id===id)?.content||"") : minuteText(S.minutes.find(m=>m.id===id))).replace(/[ \t]*\n\s*/g,"\n");
    const m=arRegex(AR.q).exec(text); const a=m?Math.max(0,text.lastIndexOf("\n",m.index)+1):0; let end=m?text.indexOf("\n",m.index+m[0].length):300; if(end<0) end=text.length;
    let piece=text.slice(a,Math.min(end,a+600)).trim();
    if(!lastField || !document.body.contains(lastField)) return navigator.clipboard?.writeText(piece).then(()=>toast("نُسخ المقتطف، الصقه في المكان المناسب"));
    lastField.value=(lastField.value?lastField.value.trimEnd()+"\n":"")+piece; lastField.dispatchEvent(new Event("input",{bubbles:true})); toast("أُدرج المقتطف");
  };
}
function bindArchive(){
  const app=$("#app");
  const rer=()=>{ const el=$("#arch-res"); if(el) el.innerHTML=archiveResultsHTML(false); };
  const q=app.querySelector("[data-arch-q]");
  if(q) q.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); AR.q=q.value.trim(); AR.q? runArchiveSearch(rer) : (AR.results=null, render()); } };
  if(app._archBound) { const ed0=$("#edf"); if(ed0) ed0.addEventListener("focusin",e=>{ if(e.target.matches("textarea,input[data-ik=topic],input[data-dk]")) lastField=e.target; }); return; }
  app._archBound=true;
  app.addEventListener("click",async e=>{
    const t=e.target.closest("[data-arch],[data-arch-open],[data-arch-edit],[data-arch-del],[data-arch-cell],[data-arch-search-editor],[data-arch-text]"); if(!t || !app.contains(t)) return;
    if(t.dataset.archSearchEditor!==undefined){ e.preventDefault(); return editorArchiveModal(t.dataset.archSearchEditor); }
    if(t.dataset.arch==="upload") return uploadModal(t.dataset.archUnit||AR.unit);
    if(t.dataset.arch==="repair") return repairArchiveTexts(t);
    if(t.dataset.arch==="csv"){ const strip=h=>String(h||"").replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
      return csvDownload(`نتائج_البحث_${AR.q.replace(/\s+/g,"_")}.csv`,[["الموضوع","الجهة","المصدر","العام","رقم المحضر","تاريخ المحضر","رقم المعاملة","تاريخ الاعتماد"],...(AR.rows||[]).map(r=>[strip(r.topicHTML)||r.topicTxt,unitById(r.unit)?.name||r.unit,r.src==="a"?"أرشيف":"المنصة",r.year,r.seq||"",r.date?fmtHs(r.date):"",r.appr||"",r.apprDate?fmtHs(r.apprDate):""])]); }
    if(t.dataset.arch==="search"){ AR.q=(app.querySelector("[data-arch-q]")?.value||"").trim(); if(!AR.q){ AR.results=null; return render(); } return runArchiveSearch(rer); }
    if(t.dataset.archOpen) return archOpen(t.dataset.archOpen);
    if(t.dataset.archText){ try{ const full=await Store.archiveGet(t.dataset.archText); let txt=esc(fixArabicPdf(full?.content||"")).replace(/\n/g,"<br>");
        modal(`<h3>النص المستخرج: ${esc(full.title)}</h3><div><p class="hint" style="margin-top:0">هذا هو النص الذي تبحث فيه المنصة. إذا وجدت كلمة مكتوبة بشكل غير صحيح أرسلها لإضافتها إلى قائمة الإصلاح.</p><div class="arch-snip" style="max-height:60vh;font-size:13.5px">${txt||'<span class="muted">لا يوجد نص.</span>'}</div><div class="acts"><button class="btn" data-close>إغلاق</button></div></div>`); $(".modal").style.maxWidth="820px"; }catch(err){ toast(err.message); } return; }
    if(t.dataset.archEdit) return archEditModal(S.archive.find(r=>r.id===t.dataset.archEdit));
    if(t.dataset.archCell){ e.preventDefault(); const [u,y]=t.dataset.archCell.split("|"); AR.unit=u; AR.year=y; AR.q=""; AR.results=null; render(); setTimeout(()=>document.querySelector(".panel.tbl-wrap")?.scrollIntoView({behavior:"smooth"}),50); return; }
    if(t.dataset.archDel){ const r=S.archive.find(x=>x.id===t.dataset.archDel); if(!confirm(`حذف «${r.title}» من الأرشيف نهائيًا؟`)) return;
      try{ await Store.archiveDelete(r); S.archive=await Store.archiveList(); toast("حُذف من الأرشيف"); render(); }catch(err){ toast(err.message); } }
  });
  app.addEventListener("change",e=>{ const s=e.target.closest("[data-arch-f]"); if(!s||!app.contains(s)) return; AR[s.dataset.archF]=s.value; if(AR.q) runArchiveSearch(rer); else { AR.results=null; render(); } });
  const ed=$("#edf"); if(ed) ed.addEventListener("focusin",e=>{ if(e.target.matches("textarea,input[data-ik=topic],input[data-dk]")) lastField=e.target; });
}

/* ---------------- modal ---------------- */
function modal(html){ closeModal(); const o=document.createElement("div"); o.className="ov"; o.id="ov"; o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener("click",e=>{ if(e.target===o||e.target.closest("[data-close]")) closeModal(); }); document.body.appendChild(o); o.querySelector("input,select,textarea,button")?.focus(); }
function closeModal(){ $("#ov")?.remove(); }
function chpwModal(){
  modal(`<h3>تغيير كلمة المرور</h3><form id="cf"><div id="cerr"></div>
    <label class="f"><span>كلمة المرور الجديدة (8 أحرف على الأقل، حروف وأرقام)</span><input class="inp" type="password" name="a" dir="ltr" autocomplete="new-password" required></label>
    <label class="f"><span>تأكيد كلمة المرور</span><input class="inp" type="password" name="b" dir="ltr" autocomplete="new-password" required></label>
    <div class="acts"><button class="btn primary">حفظ</button><button type="button" class="btn" data-close>إلغاء</button></div></form>`);
  $("#cf").onsubmit=async e=>{ e.preventDefault(); const f=e.target;
    if(!pwRules(f.a.value)) return $("#cerr").innerHTML=`<div class="err">كلمة المرور يجب ألا تقل عن 8 أحرف وتجمع بين حروف وأرقام.</div>`;
    if(f.a.value!==f.b.value) return $("#cerr").innerHTML=`<div class="err">كلمتا المرور غير متطابقتين.</div>`;
    try{ await Store.changePassword(f.a.value); closeModal(); toast("تم تغيير كلمة المرور"); }catch(err){ $("#cerr").innerHTML=`<div class="err">${esc(err.message)}</div>`; } };
}

function setQuery(k,v){ const [base,qs]=location.hash.split("?"); const q=new URLSearchParams(qs||""); v?q.set(k,v):q.delete(k); const s=q.toString(); go(base+(s?"?"+s:"")); }
function afterRender(){
  const app=$("#app");
  app.onclick = async e => {
    const tr=e.target.closest("tr[data-href]"); if(tr && !e.target.closest("a,button,select,input")) return go(tr.dataset.href);
    const b=e.target.closest("[data-act],[data-mstatus],[data-edit-user],[data-reset-user],[data-newuser-for],[data-edit-unit]"); if(!b) return;
    const a=b.dataset.act;
    if(a==="logout") return logout();
    if(a==="quran"){ e.preventDefault(); return $("#qdock.on")? quranClose() : quranOpen(); }
    if(a==="chpw"){ e.preventDefault(); $("#side")?.classList.remove("open"); return chpwModal(); }
    if(a==="menu") return $("#side").classList.toggle("open");
    if(a==="print") return window.print();
    if(a==="canceled"){ S.draft=null; return; }
    if(a==="newuser") return userModal(null);
    if(a==="bulkusers") return bulkAccountsModal();
    if(b.dataset.newuserFor) return userModal(null,b.dataset.newuserFor);
    if(b.dataset.editUser) return userModal(S.profiles.find(p=>p.id===b.dataset.editUser));
    if(b.dataset.editUnit) return unitModal(unitById(b.dataset.editUnit));
    if(b.dataset.resetUser){ const p=S.profiles.find(x=>x.id===b.dataset.resetUser); if(!confirm(`إعادة تعيين كلمة مرور ${p.full_name}؟ سيُطلب منه تعيين كلمة جديدة عند الدخول.`)) return;
      const pw=genPassword(); try{ await Store.resetPassword(p.id,pw); await loadAll(); render(); showPw(p.username,pw); }catch(err){ toast(err.message); } return; }
    if(a==="newminute"){ const us=visibleUnits().filter(u=>canWrite(u.id)); if(us.length===1) return go("#/minute/new/"+us[0].id);
      return modal(`<h3>محضر جديد لـ</h3>${us.map(u=>`<a class="node" href="#/minute/new/${u.id}" data-close>${esc(u.name)}</a>`).join("")}<div class="acts"><button class="btn" data-close>إلغاء</button></div>`); }
    if(b.dataset.mstatus){ const id=location.hash.split("/")[2]; const st=b.dataset.mstatus;
      if(st==="approved") return approvalModal(S.minutes.find(x=>x.id===id),v=>setMinuteStatus(id,"approved",null,v));
      if(st==="draft" && !confirm("إلغاء اعتماد المحضر وحذف رقم الاعتماد؟")) return;
      return setMinuteStatus(id,st); }
    if(a==="withdraw"){ const id=location.hash.split("/")[2]; if(!confirm("سحب المحضر من الاعتماد وإرجاعه مسودة للتعديل؟")) return; return setMinuteStatus(id,"draft"); }
    if(a==="editapproval"){ const id=location.hash.split("/")[2]; return approvalModal(S.minutes.find(x=>x.id===id),async v=>{ try{ await Store.update("minutes",id,v); await loadAll(); toast("حُدّثت بيانات الاعتماد"); render(); }catch(err){ toast(err.message); } }); }
    if(a==="return"){ const id=location.hash.split("/")[2];
      modal(`<h3>إعادة المحضر للتعديل</h3><form id="rf"><label class="f"><span>ملاحظاتك لرئيس اللجنة</span><textarea class="inp" name="n" required></textarea></label><div class="acts"><button class="btn primary">إعادة</button><button type="button" class="btn" data-close>إلغاء</button></div></form>`);
      $("#rf").onsubmit=e2=>{ e2.preventDefault(); const n=e2.target.n.value; closeModal(); setMinuteStatus(id,"returned",n); }; return; }
    if(a==="delminute"){ const id=location.hash.split("/")[2]; if(!confirm("حذف المحضر وقراراته نهائيًا؟")) return;
      try{ await Store.removeWhere("decisions","minute_id",id); await Store.remove("minutes",id); await loadAll(); toast("حُذف المحضر"); go("#/minutes"); }catch(err){ toast(err.message); } return; }
    if(a==="csvdec"){ const units=visibleUnits(); const ds=S.decisions.filter(d=>units.some(u=>u.id===d.unit_id));
      return csvDownload(`قرارات_${S.view.year}.csv`,[["الجهة","رقم المحضر","تاريخ المحضر","القرار","المسؤول","موعد التنفيذ","الحالة","ملاحظة المتابعة","متأخر"],...ds.map(d=>{const m=S.minutes.find(x=>x.id===d.minute_id)||{}; return [unitById(d.unit_id)?.name,m.seq,m.meeting_date?fmtHs(m.meeting_date):"",d.text,d.owner,d.due_date?fmtHs(d.due_date):"",D_STATUS[d.status],d.progress_note,isLate(d)?"نعم":""];})]); }
    if(a==="csvstats"){ const rows=[["الجهة","حالة الإحصائيات","المجموعة","المؤشر",...BRANCHES.map(x=>x[1]),"الإجمالي"]];
      visibleUnits().forEach(u=>{ const st=R_STATUS[repStatus(u.id)]; const s2=unitSummary(u);
        rows.push([u.name,st,"المحاضر","محاضر الفصل",...BRANCHES.map(()=>""),s2.minutes],[u.name,st,"المحاضر","نسبة تنفيذ القرارات %",...BRANCHES.map(()=>""),s2.completion]);
        (u.stats||[]).forEach(d=>rows.push([u.name,st,d.group||"",d.label+(d.unit==="%"?" %":""),...BRANCHES.map(([b])=>d.by==="branch"?(statVal(u.id,d.key+"@"+b)??""):""),indTotal(u,d)??""])); });
      return csvDownload(`مؤشرات_${S.view.semester}_${S.view.year}.csv`,rows); }
  };
  app.onchange = async e => {
    const t=e.target;
    if(t.dataset.period){ S.view[t.dataset.period]=t.value; return render(); }
    if(t.dataset.filter){ return setQuery(t.dataset.filter, t.type==="checkbox"? (t.checked?"1":"") : t.value); }
    if(t.dataset.decStatus){ try{ await Store.update("decisions",t.dataset.decStatus,{status:t.value,updated_at:new Date().toISOString()}); await loadAll(); toast("حُدّثت حالة القرار"); render(); }catch(err){ toast(err.message); } }
    if(t.dataset.decNote){ try{ await Store.update("decisions",t.dataset.decNote,{progress_note:t.value,updated_at:new Date().toISOString()}); const d=S.decisions.find(x=>x.id===t.dataset.decNote); if(d) d.progress_note=t.value; toast("حُفظت الملاحظة"); }catch(err){ toast(err.message); } }
  };
    const qf=$("#qsetf"); if(qf){ const qSave=async(msg)=>{ const boxes=[...qf.querySelectorAll("[data-qu]")]; const hid=boxes.filter(x=>!x.checked).map(x=>x.dataset.qu);
      try{ await Store.upsert("settings",[{key:"quran_hidden",value:JSON.stringify(hid)}],["key"]); S.settings.quran_hidden=JSON.stringify(hid); const c=$("#q-cnt"); if(c) c.textContent=`يظهر لـ ${boxes.length-hid.length} من ${boxes.length}`; toast(msg); }catch(err){ toast(err.message); } };
    qf.onchange=e=>{ const x=e.target.closest("[data-qu]"); if(!x) return; qSave(x.checked?`سيظهر الرابط لـ ${x.dataset.qn}`:`أُخفي الرابط عن ${x.dataset.qn}`); };
    qf.onclick=e=>{ const b=e.target.closest("button"); if(!b) return;
      if(b.dataset.qall){ qf.querySelectorAll("[data-qu]").forEach(x=>x.checked=b.dataset.qall==="show"); return qSave(b.dataset.qall==="show"?"أصبح الرابط ظاهرًا لجميع الأعضاء":"أُخفي الرابط عن جميع الأعضاء"); } if(b.dataset.qsrc){ qf.src.value=b.dataset.qsrc; } if(b.dataset.qtest!==undefined){ S.settings.quran_src_tmp=qf.src.value; const old=S.settings.quran_src; S.settings.quran_src=qf.src.value.trim(); quranOpen(); S.settings.quran_src=old; } };
    qf.onsubmit=async e=>{ e.preventDefault(); try{ await Store.upsert("settings",[{key:"quran_src",value:qf.src.value.trim()}],["key"]); await loadAll(); toast("حُفظ مصدر البث"); }catch(err){ toast(err.message); } }; }
  const st=$("#setf"); if(st) st.onsubmit=async e=>{ e.preventDefault(); try{ await Store.upsert("settings",[{key:"year",value:st.year.value.trim()},{key:"semester",value:st.semester.value},{key:"head",value:st.head.value.trim()},{key:"coordinator",value:st.coordinator.value.trim()},{key:"place",value:st.place.value.trim()}],["key"]); await loadAll(); S.view.year=S.settings.year; S.view.semester=S.settings.semester; toast("حُفظت الإعدادات"); render(); }catch(err){ toast(err.message); } };
  bindEditor();
  bindArchive();
  bindReport();
  const gs=$("#gsearch"); if(gs) gs.onkeydown=e=>{ if(e.key==="Enter"&&gs.value.trim()){ AR.q=gs.value.trim(); AR.unit=""; AR.year=""; AR.results=null; go("#/archive"); setTimeout(()=>runArchiveSearch(()=>{ const el=$("#arch-res"); if(el) el.innerHTML=archiveResultsHTML(false); }),30); } };
}

boot();
</script>
</body>
</html>
